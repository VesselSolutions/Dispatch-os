// DAILY OPS
function DailyOps({ctx}){
  const{drivers,carriers,loads,ops,setOps,users,setUsers,isAdmin}=ctx;
  const today=new Date().toLocaleDateString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
  const[localOps,setLocalOps]=useState(ops);
  const[notes,sn]=useState(()=>{try{return localStorage.getItem("vs4_ops_notes")||""}catch{return ""}});
  const[saved,setSaved]=useState(true);
  React.useEffect(()=>{setLocalOps(ops);},[ops]);
  const upd=(id,k,v)=>{setLocalOps(prev=>({...prev,[id]:{...(prev[id]||{}),[k]:v}}));setSaved(false);};
  const saveAll=()=>{setOps(localOps);try{localStorage.setItem("vs4_ops_notes",notes)}catch{};setSaved(true);};
  const assignDriver=(drvName,dispName,type)=>{
    const updated=users.map(u=>({...u,permDrv:(u.permDrv||[]).filter(n=>n!==drvName),tempDrv:(u.tempDrv||[]).filter(n=>n!==drvName)}));
    if(dispName&&type){const idx=updated.findIndex(u=>u.name===dispName);if(idx>=0){if(type==="perm")updated[idx]={...updated[idx],permDrv:[...(updated[idx].permDrv||[]),drvName]};else updated[idx]={...updated[idx],tempDrv:[...(updated[idx].tempDrv||[]),drvName]};}}
    setUsers(updated);
  };
  const getAssigned=(name)=>{const u=users?.find(u=>(u.permDrv||[]).includes(name)||(u.tempDrv||[]).includes(name));if(!u)return null;return{user:u,isPerm:(u.permDrv||[]).includes(name)};};
  const getDriverStatus=(name)=>{
    const al=loads.filter(l=>(l.driver||"").toLowerCase()===name.toLowerCase()).find(l=>{const s=getAutoStatus(l);return s==="Going to Pickup"||s==="In Transit";});
    if(al)return{status:getAutoStatus(al),load:al};
    const last=loads.filter(l=>(l.driver||"").toLowerCase()===name.toLowerCase()&&getAutoStatus(l)==="Delivered").sort((a,b)=>new Date(b.dlv||0)-new Date(a.dlv||0))[0];
    return{status:"Empty / Available",load:null,lastDlv:last||null};
  };
  const byCarr={};carriers.forEach(c=>{byCarr[c.name]=drivers.filter(d=>d.carrier===c.name)});
  const stC=(s)=>s==="In Transit"?"var(--amb)":s==="Going to Pickup"?"var(--blue)":s==="Empty / Available"?"var(--green)":"var(--mu)";
  const stB=(s)=>s==="In Transit"?"rgba(245,158,11,.12)":s==="Going to Pickup"?"rgba(59,130,246,.12)":s==="Empty / Available"?"rgba(34,197,94,.12)":"transparent";
  const inp={fontSize:11,padding:"3px 8px",background:"var(--sf)",border:"1px solid var(--b)",borderRadius:4,color:"var(--tx)",width:"100%",fontFamily:"inherit"};
  return(<>
    <div className="tb">
      <div><div className="pt">Daily Ops Plan</div><div className="ps">{today}</div></div>
      {isAdmin&&<button className="btn btn-p" onClick={saveAll} style={{opacity:saved?.5:1,padding:"8px 20px"}}>{saved?"✓ Saved":"💾 Save Changes"}</button>}
    </div>
    <div className="con">
      <div className="al ali" style={{marginBottom:14}}>🔄 Auto-synced with Load Board.</div>
      {Object.entries(byCarr).map(([carr,drvs])=>(
        <div key={carr} style={{marginBottom:20}}>
          <div style={{fontSize:10,fontWeight:700,color:"var(--amb)",textTransform:"uppercase",letterSpacing:".5px",padding:"7px 12px",background:"rgba(245,158,11,.06)",border:"1px solid rgba(245,158,11,.15)",borderRadius:"8px 8px 0 0",borderBottom:"none"}}>🏢 {carr}</div>
          <div className="tw" style={{borderRadius:"0 0 8px 8px"}}><table><thead><tr>
            <th>Driver</th><th>Status</th><th>Active Load</th><th>Route</th><th>Assigned To</th>
            <th>Location</th><th>Destination</th><th>Notes</th>
            {isAdmin&&<th>Override</th>}
            {isAdmin&&<th>Assign</th>}
          </tr></thead>
          <tbody>{drvs.map(d=>{
            const o=localOps[d.id]||{};
            const ds=getDriverStatus(d.name);
            const dispSt=o.status||ds.status;
            const al=ds.load;
            const asgn=getAssigned(d.name);
            return(
              <tr key={d.id} style={{background:dispSt==="Empty / Available"?"rgba(34,197,94,.03)":dispSt==="In Transit"?"rgba(245,158,11,.03)":"transparent"}}>
                <td><div style={{fontWeight:700}}>{d.name}</div><div style={{fontSize:10,color:"var(--mu)"}}>{d.phone||""}{d.truck?" · "+d.truck:""}</div></td>
                <td><span style={{fontSize:11,fontWeight:700,color:stC(dispSt),background:stB(dispSt),padding:"3px 9px",borderRadius:5,display:"inline-block",whiteSpace:"nowrap"}}>{dispSt}</span>{o.status&&<div style={{fontSize:9,color:"var(--mu)",marginTop:2}}>⚡ override</div>}</td>
                <td>{al?<div><div style={{fontSize:11,fontWeight:700,color:"var(--amb)"}}>{al.loadNum}</div><div style={{fontSize:10,color:"var(--green)"}}>${(al.amount||0).toLocaleString()}</div></div>:ds.lastDlv?<div style={{fontSize:10,color:"var(--mu)"}}>Last: {ds.lastDlv.loadNum}</div>:<span style={{color:"var(--mu)",fontSize:10}}>—</span>}</td>
                <td>{al?<div style={{fontSize:10,whiteSpace:"nowrap"}}><span style={{color:"var(--blue)"}}>{(al.pickup||"").split(",")[0]}</span><span style={{color:"var(--mu)"}}> → </span><span style={{color:"var(--green)"}}>{(al.delivery||"").split(",")[0]}</span></div>:<span style={{color:"var(--mu)",fontSize:10}}>—</span>}</td>
                <td>{asgn?<span style={{background:asgn.isPerm?"rgba(34,197,94,.12)":"rgba(59,130,246,.12)",color:asgn.isPerm?"var(--green)":"var(--blue)",borderRadius:4,padding:"2px 7px",fontSize:10,fontWeight:700}}>{asgn.user.name} {asgn.isPerm?"●":"○"}</span>:<span style={{color:"var(--mu)",fontSize:10}}>—</span>}</td>
                <td style={{minWidth:110}}>{isAdmin?<input style={inp} placeholder="City, State" value={o.loc||""} onChange={e=>upd(d.id,"loc",e.target.value)}/>:<span style={{fontSize:11}}>{o.loc||"—"}</span>}</td>
                <td style={{minWidth:110}}>{isAdmin?<input style={inp} placeholder="TX, IL..." value={o.dest||""} onChange={e=>upd(d.id,"dest",e.target.value)}/>:<span style={{fontSize:11}}>{o.dest||"—"}</span>}</td>
                <td style={{minWidth:110}}>{isAdmin?<input style={inp} placeholder="Notes..." value={o.lt||""} onChange={e=>upd(d.id,"lt",e.target.value)}/>:<span style={{fontSize:11,color:"var(--mu)"}}>{o.lt||"—"}</span>}</td>
                {isAdmin&&<td><select style={{...inp,width:"auto"}} value={o.status||""} onChange={e=>upd(d.id,"status",e.target.value)}><option value="">Auto</option><option>Empty / Available</option><option>Going to Pickup</option><option>In Transit</option><option>Off</option></select></td>}
                {isAdmin&&<td><div style={{display:"flex",flexDirection:"column",gap:3,minWidth:130}}>
                  <select style={inp} value={asgn?.user?.name||""} onChange={e=>{const s=e.target.value;if(!s)assignDriver(d.name,"","");else assignDriver(d.name,s,"perm");}}>
                    <option value="">— Unassigned —</option>
                    {users.filter(u=>u.role==="dispatcher"||u.role==="admin").map(u=><option key={u.id} value={u.name}>{u.name}</option>)}
                  </select>
                  {asgn&&<div style={{display:"flex",gap:3}}>
                    <button onClick={()=>assignDriver(d.name,asgn.user.name,"perm")} style={{flex:1,fontSize:9,padding:"2px 4px",borderRadius:3,border:"none",cursor:"pointer",background:asgn.isPerm?"var(--green)":"var(--sf)",color:asgn.isPerm?"#fff":"var(--mu)",fontFamily:"inherit",fontWeight:600}}>PERM</button>
                    <button onClick={()=>assignDriver(d.name,asgn.user.name,"temp")} style={{flex:1,fontSize:9,padding:"2px 4px",borderRadius:3,border:"none",cursor:"pointer",background:!asgn.isPerm?"var(--blue)":"var(--sf)",color:!asgn.isPerm?"#fff":"var(--mu)",fontFamily:"inherit",fontWeight:600}}>TEMP</button>
                  </div>}
                </div></td>}
              </tr>
            );
          })}</tbody></table></div>
        </div>
      ))}
      {isAdmin&&<>
        <div className="sh" style={{marginTop:8}}><div className="st">Strategy & Notes</div></div>
        <textarea style={{width:"100%",minHeight:90,background:"var(--card)",border:"1px solid var(--b)",borderRadius:8,padding:"10px 12px",color:"var(--tx)",fontFamily:"inherit",fontSize:12}} placeholder="Priority, urgency..." value={notes} onChange={e=>{sn(e.target.value);setSaved(false);}}/>
        {!saved&&<div style={{textAlign:"right",marginTop:8}}><button className="btn btn-p" onClick={saveAll}>💾 Save Changes</button></div>}
      </>}
    </div>
  </>);
}

// DRIVERS
function Drivers({ctx}){
  const{drivers,setDrv,carriers,users}=ctx;
  const[showAdd,sa]=useState(false);const[editD,setED]=useState(null);
  const[expandPics,setExpandPics]=useState({});// {drvId: true/false}
  const[tick,setTick]=useState(0);
  const[editPics,setEditPics]=useState([]);
  const blank={name:"",carrier:"",phone:"",truck:"",trailerNum:"",trailerType:"Dry Van",vin:"",cdl:"",plate:"",makeModel:"",year:"",coiEmail:"",notes:""};
  const[f,sf]=useState(blank);

  const add=()=>{
    if(!f.name||!f.carrier){alert("Name and carrier required.");return;}
    if(editD){
      const updates={...f};
      if(f._cdlPhoto){
        saveDoc(editD.id,"cdlPhoto",f._cdlPhoto);
        uploadDoc(f._cdlPhoto,"drv/"+editD.id+"/cdl_"+Date.now()).then(url=>{
          setDrv(prev=>prev.map(x=>x.id===editD.id?{...x,cdlPhoto:url!==f._cdlPhoto?url:f._cdlPhoto}:x));
        });
        updates.cdlPhoto=f._cdlPhoto;
      }
      setDrv(drivers.map(d=>d.id===editD.id?{...d,...updates,truckPics:editPics}:d));
      setED(null);
    }else{
      const newId=Date.now();
      if(f._cdlPhoto){
        saveDoc(newId,"cdlPhoto",f._cdlPhoto);
        uploadDoc(f._cdlPhoto,"drv/"+newId+"/cdl_"+Date.now()).then(url=>{
          setDrv(prev=>prev.map(x=>x.id===newId?{...x,cdlPhoto:url!==f._cdlPhoto?url:f._cdlPhoto}:x));
        });
      }
      setDrv([...drivers,{...f,id:newId,name:f.name.toUpperCase(),cdlPhoto:f._cdlPhoto||"",truckPics:editPics}]);
    }
    sf(blank);sa(false);setTick(n=>n+1);setEditPics([]);
  };
  const del=(id)=>{if(window.confirm("Remove driver?"))setDrv(drivers.filter(d=>d.id!==id))};
  const startEdit=(d)=>{
    sf({name:d.name,carrier:d.carrier,phone:d.phone||"",truck:d.truck||"",trailerNum:d.trailerNum||d.trailer||"",trailerType:d.trailerType||"Dry Van",vin:d.vin||"",cdl:d.cdl||"",plate:d.plate||"",makeModel:d.makeModel||"",year:d.year||"",notes:d.notes||"",_cdlPhoto:""});
    setEditPics(getTruckPics(d));// initialize edit pics from driver
    setED(d);sa(true);
  };
  const miss=(d)=>{const m=[];if(!d.phone)m.push("Phone");if(!d.truck)m.push("Truck #");if(!d.cdl&&!getCdlPhoto(d))m.push("CDL");if(!d.vin)m.push("VIN");return m};
  const getAssigned=(name)=>{const u=users?.find(u=>(u.permDrv||[]).includes(name)||(u.tempDrv||[]).includes(name));if(!u)return null;return{user:u,isPerm:(u.permDrv||[]).includes(name)};};
  const byC={};carriers.forEach(c=>{byC[c.name]=drivers.filter(d=>d.carrier===c.name)});

  // Truck pictures — stored as Storage URLs in driver object for cross-device sync
  // Falls back to sessionStorage for same-session display while upload completes
  const getTruckPics=(d)=>{
    if(d.truckPics&&d.truckPics.length>0)return d.truckPics;
    try{const s=sessionStorage.getItem("vsd_tp_"+d.id);return s?JSON.parse(s):[];}catch{return[];}
  };
  const saveTruckPics=(dId,arr)=>{try{sessionStorage.setItem("vsd_tp_"+dId,JSON.stringify(arr));}catch{}};
  const getCdlPhoto=(d)=>d.cdlPhoto||loadDoc(d.id,"cdlPhoto")||"";

  const uploadTruckPics=async(d,e)=>{
    const files=Array.from(e.target.files);if(!files.length)return;
    const dataUrls=await Promise.all(files.map(f=>new Promise(res=>{
      const r=new FileReader();r.onload=ev=>res(ev.target.result);r.readAsDataURL(f);
    })));
    const existing=editD&&d.id===editD.id?editPics:getTruckPics(d);
    const allPics=[...existing,...dataUrls];
    if(editD&&d.id===editD.id)setEditPics(allPics);
    saveTruckPics(d.id,allPics);setTick(n=>n+1);
    const uploaded=await Promise.all(dataUrls.map((url,i)=>uploadDoc(url,"drv/"+d.id+"/truck_"+Date.now()+"_"+i)));
    const finalPics=[...existing,...uploaded];
    if(editD&&d.id===editD.id)setEditPics(finalPics);
    saveTruckPics(d.id,finalPics);
    setDrv(prev=>prev.map(x=>x.id===d.id?{...x,truckPics:finalPics}:x));
    setTick(n=>n+1);
  };
  const removeEditPic=(idx)=>{
    const updated=editPics.filter((_,i)=>i!==idx);
    setEditPics(updated);
    if(editD){saveTruckPics(editD.id,updated);setDrv(prev=>prev.map(x=>x.id===editD.id?{...x,truckPics:updated}:x));}
    setTick(n=>n+1);
  };
  const removeTruckPic=(d,idx)=>{
    const updated=getTruckPics(d).filter((_,i)=>i!==idx);
    saveTruckPics(d.id,updated);
    setDrv(drivers.map(x=>x.id===d.id?{...x,truckPics:updated}:x));
    setTick(n=>n+1);
  };
  const downloadDoc=(dataUrl,name)=>{
    const a=document.createElement("a");
    if(dataUrl.startsWith("http")){a.href=dataUrl;a.download=name;a.click();return;}
    const[header,b64]=dataUrl.split(",");const mime=header.match(/:(.*?);/)[1];
    const ext=mime.includes("pdf")?".pdf":mime.includes("png")?".png":".jpg";
    const raw=atob(b64);const arr=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([arr],{type:mime}));
    a.href=url;a.download=name+ext;a.click();URL.revokeObjectURL(url);
  };

  return(<>
    <div className="tb"><div><div className="pt">Drivers</div><div className="ps">Driver info with missing data flags</div></div><button className="btn btn-p" onClick={()=>{sf(blank);setED(null);sa(s=>!s)}}>{showAdd?"Cancel":"+ Add Driver"}</button></div>
    <div className="con">
      {showAdd&&<div className="card" style={{maxWidth:620,marginBottom:14}}>
        <div style={{fontWeight:600,fontSize:13,marginBottom:12}}>{editD?"Edit: "+editD.name:"New Driver"}</div>
        <div className="fg">
          <div className="fl"><label>Full Name *</label><input value={f.name} onChange={e=>sf(x=>({...x,name:e.target.value}))}/></div>
          <div className="fl"><label>Carrier *</label><select value={f.carrier} onChange={e=>sf(x=>({...x,carrier:e.target.value}))}><option value="">Select</option>{carriers.map(c=><option key={c.id} value={c.name}>{c.name}</option>)}</select></div>
          <div className="fl"><label>Phone</label><input value={f.phone} onChange={e=>sf(x=>({...x,phone:e.target.value}))}/></div>
          <div className="fl"><label>Truck #</label><input value={f.truck} onChange={e=>sf(x=>({...x,truck:e.target.value}))}/></div>
          <div className="fl"><label>Trailer #</label><input value={f.trailerNum} onChange={e=>sf(x=>({...x,trailerNum:e.target.value}))}/></div>
          <div className="fl"><label>Trailer Type</label><select value={f.trailerType} onChange={e=>sf(x=>({...x,trailerType:e.target.value}))}><option>Dry Van</option><option>Reefer</option><option>Flatbed</option><option>Power Only</option></select></div>
          <div className="fl"><label>VIN</label><input value={f.vin} onChange={e=>sf(x=>({...x,vin:e.target.value}))}/></div>
          <div className="fl"><label>CDL #</label><input value={f.cdl} onChange={e=>sf(x=>({...x,cdl:e.target.value}))}/></div>
          <div className="fl"><label>Plate #</label><input value={f.plate} onChange={e=>sf(x=>({...x,plate:e.target.value}))}/></div>
          <div className="fl"><label>Make & Model</label><input value={f.makeModel} onChange={e=>sf(x=>({...x,makeModel:e.target.value}))} placeholder="e.g. Freightliner Cascadia"/></div>
          <div className="fl"><label>Year</label><input value={f.year} onChange={e=>sf(x=>({...x,year:e.target.value}))} placeholder="e.g. 2019"/></div>
          <div className="fl s2"><label>Notes</label><input value={f.notes} onChange={e=>sf(x=>({...x,notes:e.target.value}))}/></div>
        </div>
        {/* CDL Photo in edit */}
        <div style={{marginTop:12,padding:"10px 12px",background:"var(--sf)",border:"1px solid var(--b)",borderRadius:8}}>
          <div style={{fontSize:11,fontWeight:700,color:"var(--mu)",marginBottom:8}}>📄 CDL PHOTO</div>
          {(f._cdlPhoto||(editD&&getCdlPhoto(editD)))?(
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              <span className="bdg bg" style={{fontSize:10}}>✓ CDL Uploaded</span>
              <button onClick={()=>openDoc(f._cdlPhoto||(editD&&getCdlPhoto(editD)))} className="btn btn-s btn-sm">View</button>
              <button onClick={()=>downloadDoc(f._cdlPhoto||(editD&&getCdlPhoto(editD)),"CDL_"+(f.name||editD?.name||"driver"))} className="btn btn-s btn-sm">⬇ Download</button>
              <label className="btn btn-s btn-sm" style={{cursor:"pointer"}}>↑ Replace<input type="file" accept="image/*,application/pdf" style={{display:"none"}} onChange={e=>{const r=new FileReader();r.onload=ev=>sf(x=>({...x,_cdlPhoto:ev.target.result}));r.readAsDataURL(e.target.files[0]);}}/></label>
            </div>
          ):(
            <label className="btn btn-s btn-sm" style={{cursor:"pointer"}}>📷 Upload CDL Photo<input type="file" accept="image/*,application/pdf" style={{display:"none"}} onChange={e=>{const r=new FileReader();r.onload=ev=>sf(x=>({...x,_cdlPhoto:ev.target.result}));r.readAsDataURL(e.target.files[0]);}}/></label>
          )}
        </div>
        {/* Truck Pictures in edit */}
        {editD&&<div style={{marginTop:10,padding:"10px 12px",background:"var(--sf)",border:"1px solid var(--b)",borderRadius:8}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <div style={{fontSize:11,fontWeight:700,color:"var(--mu)"}}>🚛 TRUCK PICTURES ({editPics.length})</div>
            <label className="btn btn-s btn-sm" style={{cursor:"pointer"}}>+ Add Photos<input type="file" accept="image/*" multiple style={{display:"none"}} onChange={e=>uploadTruckPics(editD,e)}/></label>
          </div>
          {editPics.length===0?<div style={{fontSize:11,color:"var(--mu)"}}>No truck photos yet</div>:
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              {editPics.map((p,i)=>(
              <div key={i} style={{position:"relative",background:"var(--card)",border:"1px solid var(--b)",borderRadius:7,overflow:"hidden",width:110}}>
                <img src={p.startsWith("data:image")||p.startsWith("http")?p:""} alt={"t"+i} style={{width:"100%",height:70,objectFit:"cover",display:p.startsWith("data:image")?"block":"none",cursor:"pointer"}} onClick={()=>openDoc(p)} onError={e=>e.target.style.display="none"}/>
                {!p.startsWith("data:image")&&<div style={{height:70,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,cursor:"pointer"}} onClick={()=>openDoc(p)}>📷</div>}
                <div style={{display:"flex",gap:2,padding:"4px"}}>
                  <button onClick={()=>downloadDoc(p,"Truck_"+editD.name+"_"+(i+1))} className="btn btn-s btn-sm" style={{flex:1,fontSize:9}}>⬇</button>
                  <button onClick={()=>removeEditPic(i)} className="btn btn-d btn-sm" style={{fontSize:9}}>✕</button>
                </div>
              </div>
            ))}
          </div>}
        </div>}
        <div style={{display:"flex",gap:8,marginTop:12,justifyContent:"flex-end"}}><button className="btn btn-p" onClick={add}>{editD?"Save":"Add Driver"}</button><button className="btn btn-s" onClick={()=>{sa(false);setED(null)}}>Cancel</button></div>
      </div>}

      {Object.entries(byC).map(([carr,drvs])=>(
        <div key={carr} style={{marginBottom:18}}>
          <div style={{fontSize:10,fontWeight:700,color:"var(--acc)",textTransform:"uppercase",letterSpacing:".5px",marginBottom:8}}>🏢 {carr}</div>
          <div className="tw"><table><thead><tr><th>Driver</th><th>Assigned To</th><th>Phone</th><th>Truck</th><th>Trailer #</th><th>VIN</th><th>Plate #</th><th>Make & Model</th><th>Year</th><th>CDL #</th><th>Truck Pictures</th><th>Notes</th><th>Missing</th><th></th></tr></thead>
          <tbody>{drvs.map(d=>{
            const m=miss(d);const asgn=getAssigned(d.name);
            const pics=getTruckPics(d);const expanded=expandPics[d.id];
            return(<React.Fragment key={d.id}>
              <tr style={{cursor:"pointer"}} onClick={()=>startEdit(d)} title="Click to edit driver">
                <td style={{fontWeight:700}}>{d.name}</td>
                <td>{asgn?<span style={{background:asgn.isPerm?"rgba(34,197,94,.12)":"rgba(59,130,246,.12)",color:asgn.isPerm?"var(--green)":"var(--blue)",borderRadius:4,padding:"1px 6px",fontSize:10,fontWeight:700}}>{asgn.user.name} {asgn.isPerm?"●":"○"}</span>:<span style={{color:"var(--mu)",fontSize:10}}>—</span>}</td>
                <td>{d.phone||<span className="bdg br" style={{fontSize:9}}>Missing</span>}</td>
                <td>{d.truck||<span className="bdg br" style={{fontSize:9}}>Missing</span>}</td>
                <td style={{fontSize:11}}>{d.trailerNum||d.trailer||"—"}</td>
                <td style={{fontSize:10,color:"var(--mu)",maxWidth:100,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={d.vin||""}>{d.vin||<span className="bdg br" style={{fontSize:9}}>Missing</span>}</td>
              <td style={{fontSize:11,fontFamily:"monospace"}}>{d.plate||"—"}</td>
              <td style={{fontSize:11,color:"var(--mu)"}}>{d.makeModel||"—"}</td>
              <td style={{fontSize:11}}>{d.year||"—"}</td>
                <td style={{fontSize:11}}>
                {d.cdl&&<div style={{fontFamily:"monospace",marginBottom:3}}>{d.cdl}</div>}
                {getCdlPhoto(d)?<div style={{display:"flex",gap:3,flexWrap:"wrap"}}>
                  <button onClick={()=>openDoc(getCdlPhoto(d))} className="btn btn-s btn-sm" style={{fontSize:9}}>👁 View</button>
                  <button onClick={()=>downloadDoc(getCdlPhoto(d),"CDL_"+d.name)} className="btn btn-s btn-sm" style={{fontSize:9}}>⬇ Save</button>
                  <button onClick={()=>{downloadDoc(getCdlPhoto(d),"CDL_"+d.name);setTimeout(()=>window.open("https://mail.google.com/mail/u/0/?view=cm&fs=1&su=CDL+"+encodeURIComponent(d.name),"_blank"),500);}} className="btn btn-s btn-sm" style={{fontSize:9,background:"rgba(66,133,244,.15)",color:"#4285f4",border:"1px solid rgba(66,133,244,.3)"}}>📧 Gmail</button>
                </div>:<span className="bdg br" style={{fontSize:9}}>No Photo</span>}
              </td>
                <td>
                  <div style={{display:"flex",gap:4,alignItems:"center",flexWrap:"wrap"}}>
                    {pics.length===0?<span style={{color:"var(--mu)",fontSize:10}}>—</span>:
                    pics.map((p,i)=>(
                      <div key={i} style={{background:"var(--sf)",border:"1px solid var(--b)",borderRadius:6,padding:"4px 5px",display:"flex",flexDirection:"column",gap:3,alignItems:"center"}}>
                        <img src={p.startsWith("data:image")||p.startsWith("http")?p:""} alt={"t"+i} style={{width:44,height:36,objectFit:"cover",borderRadius:4,cursor:"pointer",display:p.startsWith("data:image")?"block":"none"}} onClick={()=>openDoc(p)} onError={e=>e.target.style.display="none"}/>
                        {!p.startsWith("data:image")&&<div onClick={()=>openDoc(p)} style={{width:44,height:36,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,cursor:"pointer"}}>📷</div>}
                        <div style={{display:"flex",gap:2}}>
                          <button onClick={()=>openDoc(p)} title="View" style={{fontSize:9,padding:"1px 4px",background:"var(--card)",border:"1px solid var(--b)",borderRadius:3,cursor:"pointer",color:"var(--tx)"}}>👁</button>
                          <button onClick={()=>downloadDoc(p,"Truck_"+d.name+"_"+(i+1))} title="Download" style={{fontSize:9,padding:"1px 4px",background:"var(--card)",border:"1px solid var(--b)",borderRadius:3,cursor:"pointer",color:"var(--tx)"}}>⬇</button>
                          <button onClick={()=>{downloadDoc(p,"Truck_"+d.name+"_"+(i+1));setTimeout(()=>window.open("https://mail.google.com/mail/u/0/?view=cm&fs=1&su=Truck+Photo+"+encodeURIComponent(d.name),"_blank"),500);}} title="Gmail" style={{fontSize:9,padding:"1px 4px",background:"rgba(66,133,244,.15)",border:"1px solid rgba(66,133,244,.3)",borderRadius:3,cursor:"pointer",color:"#4285f4"}}>📧</button>
                        </div>
                      </div>
                    ))}
                  </div>
                </td>
                <td style={{fontSize:11,color:"var(--mu)",maxWidth:140,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={d.notes||""}>{d.notes||"—"}</td>
                <td>{m.length?<span className="bdg br" style={{fontSize:10}}>{m.join(", ")}</span>:<span className="bdg bg">✓</span>}</td>
                <td><div style={{display:"flex",gap:4}}><button className="btn btn-s btn-sm" onClick={()=>startEdit(d)}>✎</button><button className="btn btn-d btn-sm" onClick={()=>del(d.id)}>✕</button></div></td>
              </tr>
              {expanded&&pics.length>0&&<tr><td colSpan={14} style={{background:"var(--sf)",padding:"10px 12px"}}>
                <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-start"}}>
                  {pics.map((p,i)=>(
                    <div key={i} style={{position:"relative",background:"var(--card)",border:"1px solid var(--b)",borderRadius:8,overflow:"hidden",width:120}}>
                      <img src={p.startsWith("data:image")||p.startsWith("http")?p:""} alt={"truck"+i} style={{width:"100%",height:80,objectFit:"cover",display:p.startsWith("data:image")?"block":"none"}} onClick={()=>openDoc(p)} onError={e=>e.target.style.display="none"}/>
                      {!p.startsWith("data:image")&&<div style={{height:80,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:"var(--mu)"}}>📄 PDF</div>}
                      <div style={{display:"flex",gap:3,padding:"4px 5px"}}>
                        <button onClick={()=>openDoc(p)} className="btn btn-s btn-sm" style={{flex:1,fontSize:9}}>View</button>
                        <button onClick={()=>downloadDoc(p,"Truck_"+d.name+"_"+(i+1))} className="btn btn-s btn-sm" style={{flex:1,fontSize:9}}>⬇</button>
                        <button onClick={()=>removeTruckPic(d,i)} className="btn btn-d btn-sm" style={{fontSize:9}}>✕</button>
                      </div>
                    </div>
                  ))}
                </div>
              </td></tr>}
            </React.Fragment>);
          })}</tbody></table></div>
        </div>
      ))}
    </div>
  </>);
}

// USERS
function Users({ctx}){
  const{users,setUsers,loads,setLoads,sess,drivers}=ctx;
  const[modal,sm]=useState(false);const[editU,seu]=useState(null);const[f,sf]=useState({u:"",pw:"",name:"",email:"",role:"dispatcher",pct:3,permDrv:[],tempDrv:[]});
  const[busy,setBusy]=useState(false);
  // Closers: who can receive leads to close (admin-managed list in the database)
  const[closerSet,setCloserSet]=useState(new Set());
  const loadClosers=()=>sbApi("lead_closers?select=email").then(d=>setCloserSet(new Set((d||[]).map(x=>x.email)))).catch(()=>{});
  // Server-side access list (who can actually log in, and as what)
  const[access,setAccess]=useState({});
  const loadAccess=()=>fetch(SB+"/rest/v1/app_access?select=*",{headers:SBH}).then(r=>r.json()).then(d=>{if(Array.isArray(d))setAccess(Object.fromEntries(d.map(r=>[r.email,r])));}).catch(()=>{});
  React.useEffect(()=>{loadAccess();loadClosers();},[]);
  const allDrvs=[...new Set(drivers.map(d=>d.name))];
  const open=(u)=>{sf(u?{...u,pw:"",_closer:closerSet.has(loginEmail(u))}:{u:"",pw:genPassword(),name:"",email:"",role:"dispatcher",pct:3,permDrv:[],tempDrv:[]});seu(u||null);sm(true)};
  const accessRow=u=>({email:loginEmail(u),role:u.role,name:u.name,sdr_trucks:u.role==="sdr"?(u.sdrTrucks||[]):[]});
  // Create the Supabase login + grant access. Password is never stored in the app.
  const createLogin=async(u,pw)=>{
    const email=loginEmail(u);
    try{await sbSignup(email,pw);}
    catch(e){
      if(!/already|registered|exists/i.test(e.message))throw e;
      // An account with this email exists. Only grant access if YOU created it (e.g. in the Supabase dashboard).
      if(!window.confirm("A login already exists for username \""+(u.u||email)+"\".\n\nOnly continue if you created it yourself (Supabase dashboard). Otherwise someone else may have registered it.\n\nGrant access to it?"))throw new Error("Cancelled");
      pw=null;
    }
    await sbUpsertAccess(accessRow(u));
    return pw;
  };
  // Create the Supabase login using the person's CURRENT password (nothing changes for them).
  // The old password copy stays in the users list until the final lockdown, so the old website keeps working meanwhile.
  const activate=async(u)=>{
    if(!loginEmail(u)){alert("This user has no username.");return;}
    let pw=u.pw;
    if(pw){if(!window.confirm("Create login for "+u.name+" with their CURRENT username and password?\n\nUsername: "+u.u+"\n(password stays the same)"))return;}
    else{pw=window.prompt("No password on file for "+u.name+". Set a password (min 6 characters) and give it to them privately:",genPassword());if(!pw)return;}
    if(pw.length<6){alert("Password must be at least 6 characters.");return;}
    setBusy(true);
    try{const used=await createLogin(u,pw);await loadAccess();alert(used?(u.pw?"Login active for "+u.name+". Same username and password as before.":"Login active.\n\nUsername: "+u.u+"\nPassword: "+used):"Access granted to existing login "+u.u+".");}
    catch(e){if(e.message!=="Cancelled")alert(e.message);}
    setBusy(false);
  };
  // One click: create logins for everyone who doesn't have one yet, keeping their current passwords
  // mode "keep": current passwords · mode "2026": password = username + 2026 (lowercase)
  const activateAll=async(mode="keep")=>{
    const pwFor=u=>mode==="2026"?(u.u||"").toLowerCase()+"2026":u.pw;
    const todo=users.filter(u=>u.u&&pwFor(u)&&!access[loginEmail(u)]);
    if(!todo.length){alert("Everyone already has a login.");return;}
    if(!window.confirm("Create logins for "+todo.length+" people?\n\n"+todo.map(u=>"• "+u.name+"   username: "+u.u+"   password: "+(mode==="2026"?pwFor(u):"(their current one)")).join("\n")))return;
    setBusy(true);const ok=[],skipped=[];
    for(const u of todo){
      try{await sbSignup(loginEmail(u),pwFor(u));await sbUpsertAccess(accessRow(u));ok.push(u.name+" → "+u.u+(mode==="2026"?" / "+pwFor(u):""));}
      catch(e){skipped.push(u.name+": "+(/already|registered|exists/i.test(e.message)?"a login with this username already exists — use its own Create login button":e.message));}
    }
    await loadAccess();setBusy(false);
    alert("Done. "+ok.length+" logins created"+(mode==="2026"?":\n\n"+ok.join("\n"):" — same usernames and passwords as before.")+(skipped.length?"\n\nNot created:\n"+skipped.join("\n"):""));
  };
  const save=async()=>{
    if(!f.u||!f.name){alert("Username and name required.");return;}
    if(!editU&&(!f.pw||f.pw.length<8)){alert("Password must be at least 8 characters.");return;}
    if(!editU&&users.find(x=>x.u===f.u)){alert("Username taken.");return;}
    const newPct=f.role==="sdr"?0:(f.pct===""||f.pct===null||f.pct===undefined?3:parseFloat(f.pct));
    const{pw,_closer,...fx}=f;// password is only sent to Supabase Auth, never saved in the users list
    const ff={...fx,email:(fx.email||"").trim(),...(fx.role==="sdr"?{permDrv:[],tempDrv:[]}:{sdrTrucks:undefined})};
    setBusy(true);
    try{
      if(editU){
        if(loginEmail(editU)!==loginEmail(ff)){alert("Username can't be changed (it's the login). Create a new user instead.");setBusy(false);return;}
        if(access[loginEmail(ff)])await sbUpsertAccess(accessRow(ff));
      }else{
        const used=await createLogin(ff,pw);
        if(used)alert("User created.\n\nUsername: "+ff.u+"\nPassword: "+used+"\n\nSend these privately.");
      }
      // "Can close leads" checkbox -> admin-only lead_closers table
      const ce=loginEmail(ff),want=!!_closer&&ff.role!=="sdr",has=closerSet.has(ce);
      if(want&&!has)await sbApi("lead_closers",{method:"POST",body:{email:ce,name:ff.name},prefer:"return=minimal"});
      else if(!want&&has)await sbApi("lead_closers?email=eq."+encodeURIComponent(ce),{method:"DELETE"});
      else if(want&&has&&editU&&editU.name!==ff.name)await sbApi("lead_closers?email=eq."+encodeURIComponent(ce),{method:"PATCH",body:{name:ff.name}});
    }catch(e){if(e.message!=="Cancelled")alert(e.message);setBusy(false);loadClosers();return;}
    setBusy(false);loadAccess();loadClosers();
    if(editU){
      // If name changed, update all loads that reference the old name
      const oldName=editU.name;
      const newName=ff.name;
      if(oldName!==newName){
        setLoads(loads.map(l=>({...l,
          dispatcher:l.dispatcher===oldName?newName:l.dispatcher,
          driver:l.driver===oldName?newName:l.driver,
        })));
      }
      setUsers(users.map(x=>{if(x.id!==editU.id)return x;const{_closer:_c,...rest}=ff;return{...x,...rest,pct:newPct};}));
    }else{
      setUsers([...users,{...ff,id:Date.now(),pct:newPct}]);
    }
    sm(false);
  };
  const lockRates=(user)=>{
    if(!window.confirm("Lock all existing loads for "+user.name+" at their current rate ("+user.pct+"%)? Do this BEFORE changing their rate."))return;
    setLoads(loads.map(l=>{
      if((l.dispatcher||"").toUpperCase()===(user.name||"").toUpperCase()&&!l.pct){
        return{...l,pct:parseFloat(user.pct)||0.5};
      }
      return l;
    }));
    alert("Done! Now you can safely change the rate.");
  };
  // Removing a user revokes their access on the server immediately
  const del=async(id)=>{
    if(id===sess.id)return;
    const u=users.find(x=>x.id===id);
    if(!window.confirm("Remove user and revoke their login?"))return;
    try{if(u&&access[loginEmail(u)])await sbDeleteAccess(loginEmail(u));}catch(e){alert(e.message);return;}
    setUsers(users.filter(x=>x.id!==id));loadAccess();
  };
  const revoke=async(u)=>{
    if(!window.confirm("Revoke login for "+u.name+"? They will lose access immediately."))return;
    try{await sbDeleteAccess(loginEmail(u));loadAccess();}catch(e){alert(e.message);}
  };
  const togD=(type,nm)=>{const a=f[type]||[];sf(x=>({...x,[type]:a.includes(nm)?a.filter(d=>d!==nm):[...a,nm]}))};
  // SDR trucks: [{driver, fee (4|5|6), start (optional YYYY-MM-DD override of first completed load)}]
  const isSdrForm=f.role==="sdr";
  const sdrT=f.sdrTrucks||[];
  const togSdr=nm=>sf(x=>{const a=x.sdrTrucks||[];return{...x,sdrTrucks:a.find(t=>t.driver===nm)?a.filter(t=>t.driver!==nm):[...a,{driver:nm,fee:5,start:""}]};});
  const updSdr=(nm,k,v)=>sf(x=>({...x,sdrTrucks:(x.sdrTrucks||[]).map(t=>t.driver===nm?{...t,[k]:v}:t)}));
  const stats=(nm)=>{const ml=loads.filter(l=>l.dispatcher?.toUpperCase()===nm?.toUpperCase());return{n:ml.length,rev:ml.reduce((s,l)=>s+(l.amount||0),0)}};
  return(<>
    <div className="tb"><div><div className="pt">Users</div><div className="ps">Manage dispatchers, roles, driver assignments</div></div><div style={{display:"flex",gap:8,flexWrap:"wrap"}}><button className="btn btn-s" disabled={busy} onClick={()=>activateAll("keep")}>🔐 Create logins (keep passwords)</button><button className="btn btn-s" disabled={busy} onClick={()=>activateAll("2026")}>🔐 Create logins: username + 2026</button><button className="btn btn-p" onClick={()=>open(null)}>+ Add User</button></div></div>
    <div className="con">
      <div className="al ali" style={{marginBottom:14}}>Dispatchers see only their own loads. Their profit shows at their % rate. Admins see everything. SDRs (external) see only the performance of the trucks you assign them.</div>
      <div className="tw"><table><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Fee %</th><th>Email</th><th>Login</th><th>Drivers / Trucks</th><th>Loads</th><th>Revenue</th><th></th></tr></thead>
      <tbody>{users.map(u=>{const s=stats(u.name);return(
        <tr key={u.id}>
          <td style={{fontWeight:700}}>{u.name}{closerSet.has(loginEmail(u))&&<span className="bdg bg" style={{marginLeft:6}} title="Can close leads">🤝 closer</span>}</td><td style={{fontFamily:"monospace",fontSize:11,color:"var(--mu)"}}>{u.u}</td>
          <td><span className={"bdg "+(u.role==="admin"?"bp":u.role==="sdr"?"ba":"bb")}>{u.role}</span></td>
          <td style={{fontWeight:700,color:"var(--acc)"}}>{u.role==="sdr"?<span style={{color:"var(--mu)"}}>—</span>:(u.id===1||u.id===2)?<span style={{color:"var(--green)"}}>0%</span>:(u.pct||3)+"%"}</td>
          <td style={{fontSize:11,color:"var(--mu)"}}>{u.email||"—"}</td>
          <td>{(()=>{const a=access[loginEmail(u)];
            if(!a)return<button className="btn btn-p btn-sm" disabled={busy} onClick={()=>activate(u)}>🔐 Create login</button>;
            return<div style={{display:"flex",gap:5,alignItems:"center"}}><span className={"bdg "+(a.role===u.role?"bg":"ba")} title={a.role!==u.role?"Server role differs — click Edit → Save to sync":""}>✓ {a.role}</span>{u.id!==sess.id&&<button className="btn btn-s btn-sm" onClick={()=>revoke(u)} title="Revoke login">⛔</button>}</div>;})()}</td>
          <td style={{fontSize:11}}>{u.role==="sdr"?((u.sdrTrucks||[]).map(t=>t.driver+" ("+t.fee+"%)").join(", ")||<span style={{color:"var(--mu)"}}>no trucks</span>):((u.permDrv||[]).join(", ")||<span style={{color:"var(--mu)"}}>—</span>)}</td>
          <td><span className="bdg bx">{s.n}</span></td><td style={{color:"var(--green)",fontWeight:600}}>${s.rev.toLocaleString()}</td>
          <td><div style={{display:"flex",gap:5}}><button className="btn btn-s btn-sm" onClick={()=>open(u)}>Edit</button>{u.id!==sess.id&&<button className="btn btn-d btn-sm" onClick={()=>del(u.id)}>✕</button>}</div></td>
        </tr>);})}</tbody></table></div>
      {modal&&<div className="modal-bg" onClick={e=>e.target===e.currentTarget&&sm(false)}>
        <div className="modal" style={{maxWidth:600}}>
          <div className="mh"><div style={{fontWeight:700,fontSize:13}}>{editU?"Edit User":"Add User"}</div><button className="xbtn" onClick={()=>sm(false)}>✕</button></div>
          <div className="mb">
            <div className="fg" style={{marginBottom:14}}>
              <div className="fl"><label>Full Name *</label><input value={f.name} onChange={e=>sf(x=>({...x,name:e.target.value}))}/></div>
              <div className="fl"><label>Role</label><select value={f.role} onChange={e=>sf(x=>({...x,role:e.target.value}))}><option value="dispatcher">Dispatcher</option><option value="admin">Admin</option><option value="sdr">SDR (external)</option></select></div>
              <div className="fl"><label>Username * (used to log in)</label><input value={f.u} disabled={!!editU} onChange={e=>sf(x=>({...x,u:e.target.value.toLowerCase().replace(/[^a-z0-9._-]/g,"")}))}/></div>
              {!editU&&<div className="fl"><label>Password * (min 8 — not stored in the app)</label><input value={f.pw} onChange={e=>sf(x=>({...x,pw:e.target.value}))}/></div>}
              <div className="fl"><label>Email (contact, optional)</label><input type="email" value={f.email} onChange={e=>sf(x=>({...x,email:e.target.value}))}/></div>
              {editU&&<div className="fl" style={{fontSize:11,color:"var(--mu)",alignSelf:"end"}}>To reset a password: Supabase → Authentication → Users.</div>}
              {!isSdrForm&&<div className="fl"><label>Current Fee %</label>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <input type="number" step="0.1" value={f.pct} onChange={e=>sf(x=>({...x,pct:e.target.value}))} style={{width:80}}/>
                {editU&&<div style={{fontSize:11,color:"var(--mu)"}}>Change → new loads use new %</div>}
              </div></div>}
            </div>
            {!isSdrForm&&<label style={{display:"flex",alignItems:"center",gap:8,fontSize:12,margin:"0 0 14px",cursor:"pointer"}}><input type="checkbox" checked={!!f._closer} onChange={e=>sf(x=>({...x,_closer:e.target.checked}))}/> 🤝 <b>Can close leads</b> <span style={{color:"var(--mu)"}}>(appears in “Transfer to Closer”)</span></label>}
            {isSdrForm&&<>
              <div style={{fontSize:10,fontWeight:700,color:"var(--mu)",letterSpacing:".5px",textTransform:"uppercase",marginBottom:8}}>Referred Trucks (SDR can see only these)</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:12}}>{allDrvs.map(n=>{const sel=!!sdrT.find(t=>t.driver===n);return(<div key={n} onClick={()=>togSdr(n)} style={{background:sel?"rgba(245,158,11,.15)":"var(--sf)",border:"1px solid "+(sel?"var(--amb)":"var(--b)"),borderRadius:5,padding:"5px 10px",cursor:"pointer",fontSize:12,userSelect:"none",fontWeight:sel?700:400,color:sel?"var(--amb)":"var(--tx)"}}>{sel?"✓ ":""}{n}</div>);})}</div>
              {sdrT.length>0&&<div className="tw" style={{marginBottom:14}}><table><thead><tr><th>Truck / Driver</th><th>Carrier Dispatch Fee</th><th>SDR Rate</th><th>Start (optional)</th></tr></thead>
                <tbody>{sdrT.map(t=><tr key={t.driver}>
                  <td style={{fontWeight:700}}>{t.driver}</td>
                  <td><select value={t.fee} onChange={e=>updSdr(t.driver,"fee",parseInt(e.target.value))}>{Object.keys(SDR_TIERS).map(k=><option key={k} value={k}>{k}%</option>)}</select></td>
                  <td style={{color:"var(--amb)",fontWeight:700}}>{SDR_TIERS[t.fee]}% of revenue</td>
                  <td><input type="date" value={t.start||""} onChange={e=>updSdr(t.driver,"start",e.target.value)} title="Leave empty = first completed load"/></td>
                </tr>)}</tbody></table></div>}
              <div className="al ali" style={{marginBottom:14,fontSize:11}}>Commission window = {SDR_MONTHS} months from each truck's first completed load (or the start date you set). The SDR only sees these trucks' loads, revenue and commission — no brokers, carriers, other users or company data.</div>
            </>}
            {!isSdrForm&&<>
            <div style={{fontSize:10,fontWeight:700,color:"var(--mu)",letterSpacing:".5px",textTransform:"uppercase",marginBottom:8}}>Permanent Drivers</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:14}}>{allDrvs.map(n=>{const sel=(f.permDrv||[]).includes(n);return(<div key={n} onClick={()=>togD("permDrv",n)} style={{display:"flex",alignItems:"center",gap:6,background:sel?"rgba(34,197,94,.15)":"var(--sf)",border:"1px solid "+(sel?"#22c55e":"var(--b)"),borderRadius:5,padding:"5px 10px",cursor:"pointer",fontSize:12,userSelect:"none",transition:"all .1s"}}>
              <div style={{width:14,height:14,borderRadius:3,border:"2px solid "+(sel?"#22c55e":"var(--b)"),background:sel?"#22c55e":"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                {sel&&<span style={{color:"#fff",fontSize:9,fontWeight:900,lineHeight:1}}>✓</span>}
              </div>
              <span style={{fontWeight:sel?700:400,color:sel?"var(--green)":"var(--tx)"}}>{n}</span>
            </div>);})}</div>
            <div style={{fontSize:10,fontWeight:700,color:"var(--mu)",letterSpacing:".5px",textTransform:"uppercase",marginBottom:8}}>One-Time Drivers</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:14}}>{allDrvs.filter(n=>!(f.permDrv||[]).includes(n)).map(n=>{const sel=(f.tempDrv||[]).includes(n);return(<div key={n} onClick={()=>togD("tempDrv",n)} style={{display:"flex",alignItems:"center",gap:6,background:sel?"rgba(34,197,94,.15)":"var(--sf)",border:"1px solid "+(sel?"#22c55e":"var(--b)"),borderRadius:5,padding:"5px 10px",cursor:"pointer",fontSize:12,userSelect:"none",transition:"all .1s"}}>
              <div style={{width:14,height:14,borderRadius:3,border:"2px solid "+(sel?"#22c55e":"var(--b)"),background:sel?"#22c55e":"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                {sel&&<span style={{color:"#fff",fontSize:9,fontWeight:900,lineHeight:1}}>✓</span>}
              </div>
              <span style={{fontWeight:sel?700:400,color:sel?"var(--green)":"var(--tx)"}}>{n}</span>
            </div>);})}</div>
            </>}
          </div>
          <div className="mf"><button className="btn btn-s" onClick={()=>sm(false)}>Cancel</button><button className="btn btn-p" disabled={busy} onClick={save}>{busy?"Saving…":editU?"Save":"Create User"}</button></div>
        </div>
      </div>}
    </div>
  </>);
}

// CARRIERS
function Carriers({ctx}){
  const{carriers,setCar,drivers}=ctx;
  const[sel,ss]=useState(null);const[tab,st]=useState("info");const[showAdd,sa]=useState(false);
  const blank={name:"",mc:"",dot:"",owner:"",phone:"",email:"",address:"",rts:"",truckstopEmail:"",truckstop:"",rmis:"",ein:"",ssn:"",notes:""};
  const[f,sf]=useState(blank);const[editC,setEC]=useState(null);const[blIn,sbl]=useState("");const[blMC,sbm]=useState("");

function Blacklist({ctx}){

  const[activeTab,sat]=useState("view");const[checkName,scn]=useState("");const[checkMC,scm]=useState("");const[checkCarr,scc]=useState("");const[checkResult,scr]=useState(null);

  const checkBroker=()=>{if(!checkCarr){scr({status:"error",msg:"Select a carrier."});return;}const carr=carriers.find(c=>c.name===checkCarr);const bl=carr?.bl||[];const hit=bl.find(b=>{const bn=typeof b==="string"?b:(b.name||"");const bmc=typeof b==="string"?"":b.mc||"";return(checkName&&bn.toLowerCase().includes(checkName.toLowerCase()))||(checkMC&&bmc&&bmc===checkMC.trim());});if(hit){const bName=typeof hit==="string"?hit:hit.name;const bMC=typeof hit==="string"?"":hit.mc;scr({status:"blocked",msg:"⛔ BLOCKED for "+checkCarr,name:bName,mc:bMC});}else scr({status:"ok",msg:"✅ Not blacklisted for "+checkCarr})};
  const delBL=(carrName,idx)=>setCar(carriers.map(c=>c.name===carrName?{...c,bl:(c.bl||[]).filter((_,i)=>i!==idx)}:c));
  const tabs=[{id:"view",l:"🚫 Blocked Brokers"},{id:"add",l:"➕ Add to Blacklist"},{id:"check",l:"🔍 Check Broker"}];
  return(<>
    <div className="tb"><div><div className="pt">Blacklist</div><div className="ps">Per-carrier broker blacklist</div></div></div>
    <div className="con">
      <div style={{display:"flex",gap:4,marginBottom:18,background:"var(--sf)",border:"1px solid var(--b)",borderRadius:8,padding:3,maxWidth:500}}>
        {tabs.map(t=><button key={t.id} onClick={()=>sat(t.id)} style={{flex:1,padding:"7px 10px",borderRadius:6,border:"none",fontSize:12,fontWeight:600,cursor:"pointer",background:activeTab===t.id?"var(--card)":"transparent",color:activeTab===t.id?"var(--tx)":"var(--mu)",fontFamily:"inherit"}}>{t.l}</button>)}
      </div>
      {activeTab==="view"&&carriers.map(carr=>(
        <div key={carr.name} style={{marginBottom:16}}>
          <div style={{fontSize:10,fontWeight:700,color:"var(--amb)",textTransform:"uppercase",letterSpacing:".5px",padding:"7px 12px",background:"rgba(245,158,11,.06)",border:"1px solid rgba(245,158,11,.15)",borderRadius:"8px 8px 0 0",borderBottom:"none",display:"flex",alignItems:"center",gap:8}}>🏢 {carr.name} <span className="bdg br">{(carr.bl||[]).length} blocked</span></div>
          <div className="tw" style={{borderRadius:"0 0 8px 8px"}}>
            {(carr.bl||[]).length===0?<div style={{padding:"12px 16px",fontSize:12,color:"var(--mu)"}}>No blocked brokers</div>:<table><thead><tr><th>#</th><th>Broker Name</th><th>MC #</th><th></th></tr></thead>
            <tbody>{(carr.bl||[]).map((b,i)=>{const bName=typeof b==="string"?b:b.name;const bMC=typeof b==="string"?"":b.mc;return(<tr key={i}><td style={{width:36,color:"var(--mu)",fontSize:10}}>{i+1}</td><td style={{fontWeight:700,color:"var(--red)"}}>{bName||"—"}</td><td style={{fontFamily:"monospace",fontSize:11,color:"var(--mu)"}}>{bMC||"—"}</td><td><button className="btn btn-d btn-sm" onClick={()=>delBL(carr.name,i)}>Remove</button></td></tr>);})}</tbody></table>}
          </div>
        </div>
      ))}
      {activeTab==="add"&&<div className="card" style={{maxWidth:480}}>
        <div style={{fontSize:11,fontWeight:700,color:"var(--mu)",marginBottom:14}}>ADD BROKER TO BLACKLIST</div>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <div className="fl"><label>Carrier *</label><select value={selC} onChange={e=>ssc(e.target.value)}><option value="">Select carrier...</option>{carriers.map(c=><option key={c.id} value={c.name}>{c.name}</option>)}</select></div>
          <div className="fl"><label>Broker Name</label><input placeholder="e.g. TQL" value={blName} onChange={e=>sbn(e.target.value)}/></div>
          <div className="fl"><label>Broker MC #</label><input placeholder="e.g. 322572" value={blMC} onChange={e=>sbm(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addBL()}/></div>
          <button className="btn btn-p" onClick={addBL} style={{alignSelf:"flex-start",padding:"9px 22px"}}>+ Add to Blacklist</button>
          {added&&<div className="al als" style={{margin:0}}>✅ Added!</div>}
        </div>
      </div>}
      {activeTab==="check"&&<div style={{maxWidth:480}}>
        <div className="card">
          <div style={{fontSize:11,fontWeight:700,color:"var(--mu)",marginBottom:14}}>CHECK IF BROKER IS BLOCKED</div>
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            <div className="fl"><label>Carrier *</label><select value={checkCarr} onChange={e=>{scc(e.target.value);scr(null)}}><option value="">Select carrier...</option>{carriers.map(c=><option key={c.id} value={c.name}>{c.name}</option>)}</select></div>
            <div className="fl"><label>Broker Name</label><input placeholder="partial match" value={checkName} onChange={e=>{scn(e.target.value);scr(null)}}/></div>
            <div className="fl"><label>OR Broker MC #</label><input placeholder="e.g. 322572" value={checkMC} onChange={e=>{scm(e.target.value);scr(null)}} onKeyDown={e=>e.key==="Enter"&&checkBroker()}/></div>
            <button className="btn btn-p" onClick={checkBroker} style={{alignSelf:"flex-start",padding:"9px 22px"}}>Check Now</button>
          </div>
          {checkResult&&<div style={{marginTop:14,padding:"14px 16px",borderRadius:9,border:"1px solid "+(checkResult.status==="blocked"?"rgba(239,68,68,.3)":"rgba(34,197,94,.3)"),background:checkResult.status==="blocked"?"rgba(239,68,68,.07)":"rgba(34,197,94,.07)"}}>
            <div style={{fontSize:15,fontWeight:700,color:checkResult.status==="blocked"?"var(--red)":"var(--green)"}}>{checkResult.msg}</div>
            {checkResult.name&&<div style={{fontSize:12,color:"var(--mu)",marginTop:4}}>Broker: <strong style={{color:"var(--tx)"}}>{checkResult.name}</strong>{checkResult.mc?" · MC: "+checkResult.mc:""}</div>}
          </div>}
        </div>
      </div>}
    </div>
  </>);
}

// RATE CALC
function RateCalc(){
  const[r,sr]=useState("");const[m,sm]=useState("");const[dh,sd]=useState("");const[tm,stm]=useState("");const[type,st]=useState("Van");
  const[qRpm,setQR]=useState("");const[qMi,setQM]=useState("");
  const a=parseFloat(r)||0,mi=parseFloat(m)||0,d=parseFloat(dh)||0;
  const tot=(mi>0||d>0)?(mi+d):(parseFloat(tm)||0);
  const setM=(v)=>{sm(v);if(v||dh)stm(String((parseFloat(v)||0)+(parseFloat(dh)||0)));if(!v&&!dh)stm("");};
  const setDh=(v)=>{sd(v);if(v||m)stm(String((parseFloat(m)||0)+(parseFloat(v)||0)));if(!v&&!m)stm("");};
  const setTm=(v)=>{stm(v);if(v){sm("");sd("");}}
  const mn=type==="Van"?2:3;
  const rpm=mi&&a?(a/mi).toFixed(2):0;const eff=tot&&a?(a/tot).toFixed(2):0;const ok=parseFloat(eff)>=mn;
  const T=[300,600,900,1200,1500,1800,2200,2500,3000];
  return(<>
    <div className="tb"><div><div className="pt">Rate Calculator</div><div className="ps">Deadhead-adjusted RPM checker</div></div></div>
    <div className="con"><div style={{display:"grid",gridTemplateColumns:"300px 1fr",gap:16}}>
      <div>
        <div className="card">
          <div className="fg">
            <div className="fl"><label>Load Type</label><select value={type} onChange={e=>st(e.target.value)}><option>Van</option><option>Reefer</option></select></div>
            <div className="fl"><label>Broker Rate ($)</label><input type="number" value={r} onChange={e=>sr(e.target.value)}/></div>
            <div className="fl"><label>Loaded Miles</label><input type="number" value={m} onChange={e=>setM(e.target.value)}/></div>
            <div className="fl"><label>Deadhead Miles</label><input type="number" value={dh} onChange={e=>setDh(e.target.value)}/></div>
            <div className="fl s2"><label>Total Miles <span style={{fontWeight:400,color:"var(--mu)",textTransform:"none",letterSpacing:0,fontSize:10}}>{mi>0||d>0?"(auto: "+(mi+d)+")":""}</span></label><input type="number" placeholder="Auto or manual" value={tm} onChange={e=>setTm(e.target.value)}/></div>
          </div>
        </div>
        {a>0&&(mi>0||tot>0)&&<>
          {!ok&&<div className="al ald">⚠️ Below min. Need ${(tot*mn).toFixed(0)}</div>}
          {ok&&<div className="al als">✅ Effective RPM: ${eff}/mi</div>}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            {[["Loaded RPM","$"+rpm,parseFloat(rpm)>=mn],["Effective RPM","$"+eff,ok],["Total Miles",tot+" mi",true],["Min Needed","$"+(tot*mn).toFixed(0),true]].map(([l,v,g])=><div key={l} style={{background:"var(--sf)",border:"1px solid var(--b)",borderRadius:8,padding:12,textAlign:"center"}}><div style={{fontSize:10,color:"var(--mu)",marginBottom:4}}>{l}</div><div style={{fontSize:20,fontWeight:700,color:g?"var(--green)":"var(--red)"}}>{v}</div></div>)}
          </div>
        </>}
      </div>
      <div><div className="sh"><div className="st">⚡ Quick: RPM × Miles</div></div>
        <div style={{background:"var(--sf)",border:"1px solid var(--b)",borderRadius:10,padding:16,marginBottom:14}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
            <div><label style={{fontSize:10,color:"var(--mu)",fontWeight:700,display:"block",marginBottom:4}}>RPM ($/mi)</label>
              <input value={qRpm} onChange={e=>setQR(e.target.value)} placeholder="e.g. 2.50" type="number" step="0.01"
                style={{width:"100%",padding:"8px 10px",background:"var(--card)",border:"1px solid var(--b)",borderRadius:6,color:"var(--tx)",fontSize:14,fontWeight:600}}/>
            </div>
            <div><label style={{fontSize:10,color:"var(--mu)",fontWeight:700,display:"block",marginBottom:4}}>MILES</label>
              <input value={qMi} onChange={e=>setQM(e.target.value)} placeholder="e.g. 800" type="number"
                style={{width:"100%",padding:"8px 10px",background:"var(--card)",border:"1px solid var(--b)",borderRadius:6,color:"var(--tx)",fontSize:14,fontWeight:600}}/>
            </div>
          </div>
          {(parseFloat(qRpm)>0&&parseFloat(qMi)>0)?(
            <div style={{textAlign:"center",background:"var(--card)",border:"1px solid var(--b)",borderRadius:8,padding:14}}>
              <div style={{fontSize:11,color:"var(--mu)",marginBottom:4}}>MIN RATE AT ${parseFloat(qRpm).toFixed(2)}/mi × {parseFloat(qMi).toLocaleString()} miles</div>
              <div style={{fontSize:32,fontWeight:800,color:"var(--green)"}}>${(parseFloat(qRpm)*parseFloat(qMi)).toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:0})}</div>
            </div>
          ):<div style={{textAlign:"center",padding:"14px 0",fontSize:12,color:"var(--mu)"}}>Enter RPM and miles above</div>}
        </div>
      <div className="sh"><div className="st">Rate Cheat Sheet</div></div>
        <div className="tw"><table><thead><tr><th>Miles</th><th>Van ($2/mi)</th><th>Reefer ($3/mi)</th></tr></thead>
        <tbody>{T.map(x=><tr key={x} style={mi&&Math.abs(x-mi)<150?{background:"rgba(240,165,0,.06)"}:{}}><td style={{fontWeight:600}}>{x.toLocaleString()}</td><td style={{color:"var(--blue)",fontWeight:600}}>${(x*2).toLocaleString()}</td><td style={{color:"var(--green)",fontWeight:600}}>${(x*3).toLocaleString()}</td></tr>)}</tbody></table></div>
      </div>
    </div></div>
  </>);
}

// PERFORMANCE
function Performance({ctx}){
  const{loads,users,apiKey}=ctx;
  const isOwnerDisp=(dispName)=>{const u=users?.find(u=>u.name===dispName);return u&&(u.id===1||u.id===2);};
  const dispPct=(dispName,l)=>isOwnerDisp(dispName)?0:(l.pct??0.5);
  const[period,sp]=useState("month");
  const[fromDate,setFrom]=useState("");
  const[toDate,setTo]=useState("");
  const[drvFilter,setDrvF]=useState("All");
  const[dispFilter,setDispF]=useState("All");
  const[aiInsights,setAI]=useState("");
  const[aiLoading,setAIL]=useState(false);
  const now=new Date();

  const allDrivers=[...new Set(loads.map(l=>l.driver).filter(Boolean))].sort();
  const allDisps=[...new Set(loads.map(l=>l.dispatcher).filter(Boolean))].sort();

  const filtered=loads.filter(l=>{
    const d=new Date(l.date||l.ts);
    if(fromDate||toDate){
      if(isNaN(d))return false;
      if(fromDate&&d<new Date(fromDate))return false;
      if(toDate&&d>new Date(toDate+"T23:59:59"))return false;
    }else{
      if(period!=="all"){
        if(!l.date&&!l.ts)return false;
        if(isNaN(d))return false;
        if(period==="day")return d.toDateString()===now.toDateString()&&matchDrv(l)&&matchDisp(l);
        if(period==="week"){const wk=new Date(now);wk.setDate(now.getDate()-7);if(d<wk)return false;}
        if(period==="month"&&(d.getMonth()!==now.getMonth()||d.getFullYear()!==now.getFullYear()))return false;
      }
    }
    return matchDrv(l)&&matchDisp(l);
  });
  function matchDrv(l){return drvFilter==="All"||(l.driver||"")===(drvFilter);}
  function matchDisp(l){return dispFilter==="All"||(l.dispatcher||"")===(dispFilter);}

  const bD={},bC={},bDsp={},bRoute={};
  filtered.forEach(l=>{
    const d=l.driver||"?";if(!bD[d])bD[d]={n:0,rev:0};bD[d].n++;bD[d].rev+=l.amount||0;
    const c=l.carrier||"?";if(!bC[c])bC[c]={n:0,rev:0};bC[c].n++;bC[c].rev+=l.amount||0;
    const ds=l.dispatcher||"?";if(!bDsp[ds])bDsp[ds]={n:0,rev:0,loads:[]};bDsp[ds].n++;bDsp[ds].rev+=l.amount||0;bDsp[ds].loads.push(l);
    if(l.pickup&&l.delivery){const r=(l.pickup.split(",")[0].trim())+" → "+(l.delivery.split(",")[0].trim());if(!bRoute[r])bRoute[r]={n:0,rev:0,rpm:[]};bRoute[r].n++;bRoute[r].rev+=l.amount||0;if(l.miles&&l.amount)bRoute[r].rpm.push((l.amount/l.miles));}
  });
  const tot=filtered.reduce((s,l)=>s+(l.amount||0),0);
  const sort=o=>Object.entries(o).sort((a,b)=>b[1].rev-a[1].rev);
  const topRoutes=Object.entries(bRoute).sort((a,b)=>b[1].rev-a[1].rev).slice(0,10);
  const periodLabel={day:"Today",week:"This Week",month:"This Month",all:"All Time"}[period];

  const genInsights=async()=>{
    if(!apiKey){alert("No API key set.");return;}
    setAIL(true);setAI("");
    const summary={
      totalLoads:filtered.length,totalRevenue:tot,
      topDrivers:sort(bD).slice(0,5).map(([d,v])=>({driver:d,loads:v.n,revenue:v.rev})),
      topRoutes:topRoutes.slice(0,5).map(([r,v])=>({route:r,loads:v.n,revenue:v.rev,avgRPM:v.rpm.length?(v.rpm.reduce((a,b)=>a+b,0)/v.rpm.length).toFixed(2):"N/A"})),
      topCarriers:sort(bC).slice(0,3).map(([c,v])=>({carrier:c,loads:v.n,revenue:v.rev})),
      driverAreaFrequency:Object.entries(bD).map(([d])=>{
        const areas={};filtered.filter(l=>l.driver===d).forEach(l=>{const a=(l.delivery||"").split(",")[1]?.trim()||"Unknown";areas[a]=(areas[a]||0)+1;});
        return{driver:d,areas:Object.entries(areas).sort((a,b)=>b[1]-a[1]).slice(0,3)};
      }).slice(0,5),
    };
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({
          model:"claude-haiku-4-5-20251001",max_tokens:1000,
          messages:[{role:"user",content:`You are a freight dispatch analyst. Analyze this dispatch data and provide actionable insights in 5-7 bullet points. Focus on: best performing routes, top drivers, opportunities, patterns. Be specific with numbers.\n\nData: ${JSON.stringify(summary)}`}]
        })
      });
      const data=await res.json();
      setAI(data.content?.[0]?.text||"No insights generated.");
    }catch(e){setAI("Error generating insights: "+e.message);}
    setAIL(false);
  };

  return(<>
    <div className="tb">
      <div><div className="pt">Performance</div><div className="ps">Revenue by driver, carrier, dispatcher</div></div>
      <div style={{display:"flex",gap:5,background:"var(--sf)",border:"1px solid var(--b)",borderRadius:8,padding:3}}>
        {["day","week","month","all"].map(p=>(
          <button key={p} onClick={()=>{sp(p);setFrom("");setTo("");}} style={{padding:"5px 12px",borderRadius:6,border:"none",fontSize:12,fontWeight:600,cursor:"pointer",background:period===p&&!fromDate&&!toDate?"var(--card)":"transparent",color:period===p&&!fromDate&&!toDate?"var(--tx)":"var(--mu)",fontFamily:"inherit"}}>
            {p==="day"?"Today":p==="week"?"Week":p==="month"?"Month":"All Time"}
          </button>
        ))}
      </div>
    </div>
    <div className="con">
      {/* Filters */}
      <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap",alignItems:"center",background:"var(--sf)",border:"1px solid var(--b)",borderRadius:8,padding:"10px 14px"}}>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <span style={{fontSize:11,color:"var(--mu)",fontWeight:600}}>FROM</span>
          <input type="date" value={fromDate} onChange={e=>setFrom(e.target.value)} style={{fontSize:12,padding:"4px 8px",background:"var(--card)",border:"1px solid var(--b)",borderRadius:6,color:"var(--tx)"}}/>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <span style={{fontSize:11,color:"var(--mu)",fontWeight:600}}>TO</span>
          <input type="date" value={toDate} onChange={e=>setTo(e.target.value)} style={{fontSize:12,padding:"4px 8px",background:"var(--card)",border:"1px solid var(--b)",borderRadius:6,color:"var(--tx)"}}/>
        </div>
        <select value={drvFilter} onChange={e=>setDrvF(e.target.value)} style={{fontSize:12,padding:"4px 8px",background:"var(--card)",border:"1px solid var(--b)",borderRadius:6,color:"var(--tx)"}}>
          <option value="All">All Drivers</option>
          {allDrivers.map(d=><option key={d} value={d}>{d}</option>)}
        </select>
        <select value={dispFilter} onChange={e=>setDispF(e.target.value)} style={{fontSize:12,padding:"4px 8px",background:"var(--card)",border:"1px solid var(--b)",borderRadius:6,color:"var(--tx)"}}>
          <option value="All">All Dispatchers</option>
          {allDisps.map(d=><option key={d} value={d}>{d}</option>)}
        </select>
        {(fromDate||toDate||drvFilter!=="All"||dispFilter!=="All")&&<button onClick={()=>{setFrom("");setTo("");setDrvF("All");setDispF("All");}} className="btn btn-s btn-sm">✕ Clear</button>}
        <button onClick={genInsights} className="btn btn-p btn-sm" disabled={aiLoading} style={{marginLeft:"auto"}}>{aiLoading?"⏳ Analyzing...":"✨ AI Insights"}</button>
      </div>

      {/* AI Insights */}
      {aiInsights&&<div style={{background:"rgba(99,102,241,.08)",border:"1px solid rgba(99,102,241,.25)",borderRadius:10,padding:"14px 16px",marginBottom:14}}>
        <div style={{fontSize:12,fontWeight:700,color:"#818cf8",marginBottom:8}}>✨ AI Insights</div>
        <div style={{fontSize:12,lineHeight:1.8,color:"var(--tx)",whiteSpace:"pre-wrap"}}>{aiInsights}</div>
      </div>}

      <div style={{fontSize:11,color:"var(--mu)",fontWeight:600,textTransform:"uppercase",letterSpacing:".5px",marginBottom:12}}>
        {fromDate||toDate?`${fromDate||"..."} → ${toDate||"..."}`:periodLabel} — {filtered.length} loads
      </div>
      {filtered.length===0&&<div style={{textAlign:"center",padding:40,color:"var(--mu)"}}>No data for this period</div>}
      {filtered.length>0&&<>
        <div className="mg" style={{gridTemplateColumns:"repeat(3,1fr)"}}>
          <div className="mc"><div className="ml">Total Revenue</div><div className="mv cacc">${tot.toLocaleString()}</div></div>
          <div className="mc"><div className="ml">Total Profit (3%)</div><div className="mv cg">${(tot*0.03).toFixed(0)}</div></div>
          <div className="mc"><div className="ml">Total Loads</div><div className="mv cb">{filtered.length}</div></div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
          <div>
            <div className="sh"><div className="st">By Driver</div></div>
            <div className="tw"><table><thead><tr><th>Driver</th><th>Loads</th><th>Revenue</th><th>Profit</th></tr></thead>
            <tbody>{sort(bD).map(([d,v])=><tr key={d}><td style={{fontWeight:700}}>{d}</td><td><span className="bdg bx">{v.n}</span></td><td style={{color:"var(--green)",fontWeight:600}}>${v.rev.toLocaleString()}</td><td style={{color:"var(--acc)"}}>${(v.rev*0.03).toFixed(0)}</td></tr>)}</tbody></table></div>

            <div className="sh" style={{marginTop:14}}><div className="st">By Dispatcher</div></div>
            <div className="tw"><table><thead><tr><th>Dispatcher</th><th>Loads</th><th>Revenue</th><th>Their Payout</th><th>Company Keeps</th></tr></thead>
            <tbody>{sort(bDsp).map(([d,v])=>{
              const payout=(v.loads||[]).reduce((s,l)=>s+(l.amount||0)*dispPct(d,l)/100,0);
              const keeps=(v.loads||[]).reduce((s,l)=>s+(l.amount||0)*(3-dispPct(d,l))/100,0);
              const avgPct=isOwnerDisp(d)?0:(v.loads&&v.loads.length?(payout/Math.max(v.rev,1)*100).toFixed(1):0.5);
              return(<tr key={d}>
                <td style={{fontWeight:700}}>{d}</td><td><span className="bdg bx">{v.n}</span></td>
                <td style={{color:"var(--green)",fontWeight:600}}>${v.rev.toLocaleString()}</td>
                <td style={{color:isOwnerDisp(d)?"var(--green)":"var(--blue)",fontWeight:700}}>${payout.toFixed(2)}<span style={{fontSize:9,color:"var(--mu)",marginLeft:4}}>{isOwnerDisp(d)?"owner — 0%":"avg "+avgPct+"%"}</span></td>
                <td style={{color:"var(--green)",fontWeight:700}}>${keeps.toFixed(2)}</td>
              </tr>);
            })}</tbody></table></div>
          </div>
          <div>
            <div className="sh"><div className="st">By Carrier</div></div>
            <div className="tw"><table><thead><tr><th>Carrier</th><th>Loads</th><th>Revenue</th><th>Share</th></tr></thead>
            <tbody>{sort(bC).map(([c,v])=><tr key={c}><td style={{fontWeight:600,fontSize:11}}>{c.split(" ")[0]}</td><td><span className="bdg bx">{v.n}</span></td><td style={{color:"var(--green)",fontWeight:600}}>${v.rev.toLocaleString()}</td><td style={{width:80}}><div style={{fontSize:10,color:"var(--mu)",marginBottom:3}}>{tot?((v.rev/tot)*100).toFixed(0):0}%</div><div style={{height:4,background:"var(--b)",borderRadius:2,overflow:"hidden"}}><div style={{height:"100%",background:"var(--green)",borderRadius:2,width:tot?(v.rev/tot*100)+"%":"0"}}></div></div></td></tr>)}</tbody></table></div>

            <div className="sh" style={{marginTop:14}}><div className="st">Top Routes</div></div>
            <div className="tw"><table><thead><tr><th>Route</th><th>Loads</th><th>Revenue</th><th>Avg RPM</th></tr></thead>
            <tbody>{topRoutes.map(([r,v])=><tr key={r}>
              <td style={{fontSize:11,fontWeight:600}}>{r}</td>
              <td><span className="bdg bx">{v.n}</span></td>
              <td style={{color:"var(--green)",fontWeight:600}}>${v.rev.toLocaleString()}</td>
              <td style={{color:"var(--acc)"}}>{v.rpm.length?("$"+(v.rpm.reduce((a,b)=>a+b,0)/v.rpm.length).toFixed(2)):"—"}</td>
            </tr>)}</tbody></table></div>
          </div>
        </div>
      </>}
    </div>
  </>);
}

// ── SALES: leads pipeline + leaderboard (shared by the staff app and the SDR portal).
// Leads live in the "leads" table; the database decides who sees/edits what:
// everyone sees only their own leads, admins (closers) see all, only admins can close/lose.
const LEAD_STAGES=[
  {id:"new",l:"New",c:"bx"},
  {id:"interested",l:"Interested",c:"bb"},
  {id:"transferred",l:"Transferred to Closer",c:"ba"},
  {id:"closed",l:"Closed ✓",c:"bg"},
  {id:"lost",l:"Lost",c:"br"},
];
const stageOf=id=>LEAD_STAGES.find(s=>s.id===id)||LEAD_STAGES[0];
const isOpenLead=l=>l.stage!=="closed"&&l.stage!=="lost";
async function sbApi(path,{method="GET",body,prefer}={}){
  const r=await fetch(SB+"/rest/v1/"+path,{method,headers:{...SBH,...(prefer?{"Prefer":prefer}:{})},body:body?JSON.stringify(body):undefined});
  const t=await r.text();let d=null;try{d=t?JSON.parse(t):null;}catch{}
  if(!r.ok)throw new Error((d&&d.message)||t||"Request failed");
  return d;
}

    </div>
    <div className="con">
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
        {chip("open","Open")}{LEAD_STAGES.map(s=>chip(s.id,s.l))}{chip("all","All")}

      {(isAdmin||all.some(l=>l.closer_email===myEmail))&&<div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",marginBottom:12}}>

        <label style={{fontSize:12,display:"flex",alignItems:"center",gap:6,cursor:"pointer"}}><input type="checkbox" checked={mine} onChange={e=>setMine(e.target.checked)}/> Transferred to me</label>
      </div>}
      {err&&<div className="al ald" style={{marginBottom:12}}>{err}</div>}
      {!isAdmin&&all.filter(l=>l.stage==="transferred"&&l.closer_email===myEmail).length>0&&!mine&&<div className="al" style={{marginBottom:12,background:"rgba(34,197,94,.12)",border:"1px solid var(--green)",color:"var(--green)",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
        🤝 <b>{all.filter(l=>l.stage==="transferred"&&l.closer_email===myEmail).length} lead(s) transferred to you to close</b>

        ⏳ <b>{all.filter(l=>l.stage==="interested").length} interested lead{all.filter(l=>l.stage==="interested").length>1?"s":""} waiting for a closer</b>

      {shown.map(l=>{const st=stageOf(l.stage);const own=l.owner_email===myEmail;const open=isOpenLead(l);const late=open&&l.followup&&l.followup<today;return(
        <div key={l.id} className="card" style={{padding:14,marginBottom:10}}>

            <div>
