let _auth=null;try{_auth=JSON.parse(sessionStorage.getItem("vs_auth")||"null");}catch{}

async function authToken(grant,body){

function dbGet(k){return fetch(SB+"/rest/v1/kv_store?key=eq."+k+"&select=value",{headers:SBH}).then(r=>r.json()).then(d=>d&&d[0]?d[0].value:undefined).catch(()=>undefined);}
function dbSet(k,v){
  // SAFETY GUARD: never write empty/tiny arrays for critical keys
  const CRITICAL_MIN={"vs4_d":1,"vs4_c":1,"vs4_l":1,"vs4_u":1};
  if(CRITICAL_MIN[k]!==undefined&&Array.isArray(v)&&v.length<CRITICAL_MIN[k]){

    dbGet(k).then(serverVal=>{
      const serverArr=Array.isArray(serverVal)?serverVal:[];

        const localMap=new Map(v.map(l=>[l.id,l]));

function _dbSetRaw(k,v){
  const e=document.getElementById("sync-dot");

// Upload doc to Supabase Storage. Falls back to base64 if bucket not ready.
async function uploadDoc(dataUrl,path){
  try{
    const[header,b64]=dataUrl.split(",");
    const mime=header.match(/:(.*?);/)[1];
    const ext=mime.includes("pdf")?".pdf":mime.includes("png")?".png":".jpg";
    // Chunked base64→Blob conversion — handles large files without crashing
    const raw=atob(b64);
    const chunkSize=1024*512;// 512KB chunks
    const chunks=[];
    for(let i=0;i<raw.length;i+=chunkSize){
      const slice=raw.slice(i,i+chunkSize);
      const bytes=new Uint8Array(slice.length);
      for(let j=0;j<slice.length;j++)bytes[j]=slice.charCodeAt(j);
      chunks.push(bytes);
    }
    const blob=new Blob(chunks,{type:mime});
    const res=await fetch(SB+"/storage/v1/object/documents/"+path+ext,{
      method:"POST",headers:{"apikey":SK,"Authorization":SBH.Authorization,"Content-Type":mime,"x-upsert":"true"},body:blob
    });
    if(!res.ok){const t=await res.text();throw new Error(res.status+": "+t);}
    return SB+"/storage/v1/object/public/documents/"+path+ext;
  }catch(e){console.warn("uploadDoc failed:",e.message);return dataUrl;}
}
// Compress image dataUrl to under target size (for PODs from phone cameras)
async function compressImg(dataUrl,maxKB=900){
  if(!dataUrl.startsWith("data:image"))return dataUrl;
  if(dataUrl.length<maxKB*1024*1.37)return dataUrl;// already small enough
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement("canvas");
      let w=img.width,h=img.height;
      const maxD=1600;if(w>maxD||h>maxD){if(w>h){h=Math.round(h*maxD/w);w=maxD;}else{w=Math.round(w*maxD/h);h=maxD;}}
      canvas.width=w;canvas.height=h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      const try_q=(q)=>{
        const r=canvas.toDataURL("image/jpeg",q);
        if(r.length<maxKB*1024*1.37||q<=0.2)res(r);else try_q(q-0.1);
      };
      try_q(0.75);
    };
    img.onerror=()=>res(dataUrl);
    img.src=dataUrl;
  });
}

    dbGet(k).then(r=>{
      if(!on)return;
      if(r!==undefined){
        const merged=applyFixes(r,sv);
        sv(merged);try{localStorage.setItem(k,JSON.stringify(stripForStorage(k,merged)))}catch{}
      }else{try{const l=localStorage.getItem(k);if(l){const parsed=JSON.parse(l);if(!Array.isArray(parsed)||parsed.length>0)dbSet(k,parsed);}}catch{}}
    });
    const iv=setInterval(()=>{dbGet(k).then(r=>{
      if(r===undefined||!on)return;
      const merged=applyFixes(r,sv);
      const n=JSON.stringify(merged);
      if(n!==JSON.stringify(ref.current)){sv(merged);try{localStorage.setItem(k,JSON.stringify(stripForStorage(k,merged)))}catch{}}
    });},5000);
    return()=>{on=false;clearInterval(iv);};
  },[k]);
  const stripForStorage=(key,data)=>{
    if(key!=="vs4_l"||!Array.isArray(data))return data;
    return data.map(l=>{
      const c={...l};
      if(c.rateCon&&c.rateCon.startsWith("data:"))delete c.rateCon;
      if(c.pod&&c.pod.startsWith("data:"))delete c.pod;
      if(c.pods)c.pods=c.pods.filter(p=>p&&!p.startsWith("data:"));
      return c;
    });
  };
  const set=useCallback(n=>{const r=typeof n==="function"?n(ref.current):n;sv(r);try{localStorage.setItem(k,JSON.stringify(stripForStorage(k,r)))}catch{}dbSet(k,r);},[k]);
  return[v,set];
}

// Open a document (base64 dataUrl or Storage URL) in a new tab
function openDoc(dataUrl){
  if(!dataUrl)return;
  if(dataUrl.startsWith("http")){window.open(dataUrl,"_blank");return;}
  try{
    const[header,b64]=dataUrl.split(",");
    const mime=header.match(/:(.*?);/)[1];
    const bin=atob(b64);const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([arr],{type:mime}));
    window.open(url,"_blank");
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){console.warn("openDoc failed:",e);}
}
function downloadDoc(dataUrl,name){
  if(!dataUrl)return;
  const a=document.createElement("a");
  if(dataUrl.startsWith("http")){
    // For Storage URLs, fetch then download
    fetch(dataUrl).then(r=>r.blob()).then(blob=>{
      const url=URL.createObjectURL(blob);
      const ext=blob.type.includes("pdf")?".pdf":blob.type.includes("png")?".png":".jpg";
      a.href=url;a.download=(name||"file")+ext;a.click();URL.revokeObjectURL(url);
    }).catch(()=>{a.href=dataUrl;a.download=name||"file";a.click();});
    return;
  }
  try{
    const[header,b64]=dataUrl.split(",");
    const mime=header.match(/:(.*?);/)[1];
    const ext=mime.includes("pdf")?".pdf":mime.includes("png")?".png":".jpg";
    const bin=atob(b64);const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([arr],{type:mime}));
    a.href=url;a.download=(name||"file")+ext;a.click();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
  }catch(e){console.warn("downloadDoc failed:",e);}
}

function getAutoStatus(load){
  if(load.cancelled)return"Cancelled";
  if(load.manualStatus)return load.manualStatus;
  const now=new Date();
  // Build pickup datetime
  const puStr=load.pu?(load.pu+"T"+(load.puTime||"00:00")):null;
  const dlvStr=load.dlv?(load.dlv+"T"+(load.dlvTime||"23:59")):null;
  const puDt=puStr?new Date(puStr):null;
  const dlvDt=dlvStr?new Date(dlvStr):null;
  if(dlvDt&&now>=dlvDt)return"Delivered";
  if(puDt&&now<puDt)return"Going to Pickup";
  if(puDt&&now>=puDt)return"In Transit";
  return load.status||"In Transit";
}

function DateRangePicker({from,to,onFrom,onTo,label}){
  const[open,setOpen]=useState(false);
  const[viewDate,setVD]=useState(()=>{const d=new Date();return{y:d.getFullYear(),m:d.getMonth()};});
  const[hovered,setHovered]=useState(null);
  const ref=React.useRef(null);
  React.useEffect(()=>{
    const h=(e)=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};
    document.addEventListener("mousedown",h);return()=>document.removeEventListener("mousedown",h);
  },[]);
  const days=["Su","Mo","Tu","We","Th","Fr","Sa"];
  const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const firstDay=new Date(viewDate.y,viewDate.m,1).getDay();
  const daysInMonth=new Date(viewDate.y,viewDate.m+1,0).getDate();
  const prev=()=>setVD(v=>v.m===0?{y:v.y-1,m:11}:{y:v.y,m:v.m-1});
  const next=()=>setVD(v=>v.m===11?{y:v.y+1,m:0}:{y:v.y,m:v.m+1});
  const fmt=(d)=>{if(!d)return null;const p=d.split("-");return new Date(+p[0],+p[1]-1,+p[2]);};
  const toStr=(d)=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const click=(day)=>{
    const str=toStr(new Date(viewDate.y,viewDate.m,day));
    if(!from||( from&&to)){onFrom(str);onTo("");} // reset
    else if(str<from){onFrom(str);}
    else{onTo(str);}
  };
  const displayLabel=from&&to?`${from} → ${to}`:from?`${from} → ...`:label;
  return(
    <div ref={ref} style={{position:"relative",display:"inline-block"}}>
      <button onClick={()=>setOpen(o=>!o)} className="si" style={{cursor:"pointer",textAlign:"left",minWidth:200,color:from?"var(--tx)":"var(--mu)",background:"var(--card)",border:"1px solid var(--b)",borderRadius:6,padding:"6px 10px",fontSize:12,whiteSpace:"nowrap"}}>
        📅 {displayLabel}
        {(from||to)&&<span onClick={e=>{e.stopPropagation();onFrom("");onTo("");}} style={{marginLeft:8,color:"var(--red)",cursor:"pointer",fontSize:10}}>✕</span>}
      </button>
      {open&&<div style={{position:"absolute",top:"calc(100% + 6px)",left:0,zIndex:999,background:"var(--card)",border:"1px solid var(--b)",borderRadius:10,boxShadow:"0 8px 32px rgba(0,0,0,.4)",padding:14,minWidth:260}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <button onClick={prev} style={{background:"none",border:"none",color:"var(--tx)",cursor:"pointer",fontSize:16,padding:"2px 8px"}}>‹</button>
          <div style={{fontWeight:700,fontSize:13}}>{months[viewDate.m]} {viewDate.y}</div>
          <button onClick={next} style={{background:"none",border:"none",color:"var(--tx)",cursor:"pointer",fontSize:16,padding:"2px 8px"}}>›</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:4}}>
          {days.map(d=><div key={d} style={{textAlign:"center",fontSize:10,color:"var(--mu)",fontWeight:600,padding:"2px 0"}}>{d}</div>)}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}}>
          {Array(firstDay).fill(null).map((_,i)=><div key={"e"+i}/>)}
          {Array(daysInMonth).fill(null).map((_,i)=>{
            const day=i+1;
            const str=toStr(new Date(viewDate.y,viewDate.m,day));
            const isFrom=str===from;const isTo=str===to;
            const inRange=from&&to&&str>from&&str<to;
            const hov=from&&!to&&hovered&&str>from&&str<=hovered;
            const bg=isFrom||isTo?"var(--acc)":inRange||hov?"rgba(240,165,0,.2)":"transparent";
            const col=isFrom||isTo?"#000":"var(--tx)";
            return(<div key={day} onClick={()=>click(day)} onMouseEnter={()=>setHovered(str)} onMouseLeave={()=>setHovered(null)}
              style={{textAlign:"center",fontSize:12,padding:"5px 2px",borderRadius:isFrom?"6px 0 0 6px":isTo?"0 6px 6px 0":inRange||hov?"0":6,background:bg,color:col,cursor:"pointer",fontWeight:isFrom||isTo?700:400,transition:"background .1s"}}>
              {day}
            </div>);
          })}
        </div>
        <div style={{marginTop:10,fontSize:10,color:"var(--mu)",textAlign:"center"}}>
          {!from?"Click to select start date":!to?"Now click end date":"Range selected ✓"}
        </div>
      </div>}
    </div>
  );
}

                  <span className={"bdg "+aColor} style={{display:"block",marginBottom:2,fontSize:9}}>{as}</span>
                  <select style={{background:"var(--sf)",border:"1px solid var(--b)",color:"var(--tx)",fontSize:10,padding:"1px 4px",borderRadius:3,fontFamily:"inherit",width:"100%"}} value={l.manualStatus||""} onChange={e=>upd(l.id,"manualStatus",e.target.value||undefined)}>
                    <option value="">Auto</option>
                    {["Going to Pickup","In Transit","Delivered","Cancelled"].map(s=><option key={s} value={s}>{s}</option>)}
                  </select>
                </div>
                :<span className={"bdg "+aColor}>{as}</span>}
              </td>);})()}
            {isAdmin&&<td style={{fontSize:11,color:"var(--blue)"}}>{l.dispatcher}</td>}
            <td style={{fontSize:9,color:"var(--mu)",whiteSpace:"nowrap"}}>{l.ts?new Date(l.ts).toLocaleString("en-US",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}):l.date||"—"}</td>
            <td style={{fontSize:10,color:"var(--mu)",maxWidth:120,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={l.notes||""}>{l.notes||"—"}</td>
            <td><div style={{display:"flex",gap:4}}>
              <button className="btn btn-s btn-sm" onClick={()=>openLoad(l.id)}>Open</button>
              {isAdmin&&<><button className="btn btn-s btn-sm" onClick={()=>setEL(l)} title="Edit/Exception">✎</button><button className="btn btn-d btn-sm" onClick={()=>del(l.id)}>✕</button></>}
            </div></td>
          </tr>);
        })}
      </tbody></table></div>
    </div>
    {editL&&<ExModal load={editL} isAdmin={ctx.isAdmin} onClose={()=>setEL(null)} onSave={d=>{ctx.setLoads(loads.map(l=>l.id===editL.id?{...l,...d}:l));setEL(null)}}/>}
  </>);
}

function LoadDetail({load,onClose,onUpdate,onFile}){
  if(!load)return null;
  const[notes,sn]=useState(load.notes||"");
  const[saved,ss]=useState(false);
  const[podTick,setPodTick]=useState(0);
  const podList=loadPods(load.id);// read fresh from sessionStorage every render

  const hFile=async(field,e)=>{
    const f=e.target.files[0];if(!f)return;
    const dataUrl=await new Promise(res=>{const r=new FileReader();r.onload=ev=>res(ev.target.result);r.readAsDataURL(f);});
    // Show immediately in UI while uploading
    onFile(load.id,field,dataUrl);
    saveDoc(load.id,"rc",dataUrl);
    // Upload to Supabase Storage to get a permanent URL (same as PODs)
    const path="rc/"+load.id+"_"+Date.now();
    const url=await uploadDoc(dataUrl,path);
    const finalUrl=url!==dataUrl?url:dataUrl;
    // Save URL under "rc" key consistently (not "rateCon") so getDocUrl finds it
    try{const key="vs4_du_"+load.id;const ex=JSON.parse(localStorage.getItem(key)||"{}");ex.rc=finalUrl;localStorage.setItem(key,JSON.stringify(ex));dbSet(key,ex);}catch{}
    // Update load state with URL so it persists in vs4_l
    onUpdate(load.id,{rateCon:finalUrl});
    onFile(load.id,field,finalUrl);
  };

  const hPods=async(e)=>{
    const files=Array.from(e.target.files);if(!files.length)return;
    for(const f of files){
      const dataUrl=await new Promise(res=>{const r=new FileReader();r.onload=ev=>res(ev.target.result);r.readAsDataURL(f);});
      // Always try Storage first — URL is tiny and syncs everywhere
      const path="pod/"+Date.now()+"_"+Math.random().toString(36).slice(2);
      const url=await uploadDoc(dataUrl,path);
      const finalUrl=url!==dataUrl?url:dataUrl;// URL if Storage worked, base64 if not
      const cur=loadPods(load.id);
      const updated=[...cur,finalUrl];
      savePods(load.id,updated);
      syncPodUrls(load.id,updated);
      onUpdate(load.id,{pods:updated,pod:updated[0]});
      setPodTick(n=>n+1);
    }
  };

  const removePod=(idx)=>{
    const updated=loadPods(load.id).filter((_,i)=>i!==idx);
    savePods(load.id,updated);
    syncPodUrls(load.id,updated);
    // Also update the load object in state so hasPod() and the factoring badge reflect the removal
    onUpdate(load.id,{pods:updated,pod:updated[0]||""});
    setPodTick(n=>n+1);
  };

  const save=()=>{onUpdate(load.id,{notes});ss(true);setTimeout(()=>ss(false),2000)};
  return(
    <div style={{background:"var(--card)",border:"1px solid var(--b)",borderRadius:10,padding:18,marginBottom:18}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <div style={{fontWeight:600,fontSize:13}}>Load #{load.loadNum} — {load.driver} · {load.carrier?.split(" ")[0]}</div>
        <div style={{display:"flex",gap:6}}>
          <button className="btn btn-s btn-sm" onClick={()=>{
            if(window._docFetchCache)delete window._docFetchCache[load.id];
            dbGet("vs4_du_"+load.id).then(d=>{
              if(d){
                try{localStorage.setItem("vs4_du_"+load.id,JSON.stringify(d));}catch{}
                const rc=d.rc||"";const pods=d.pods||[];
                if(rc)onFile(load.id,"rateCon",rc);
                if(pods.length){savePods(load.id,pods);setPodTick(n=>n+1);}
                if(rc||pods.length)alert("Docs synced ✓");
                else alert("No docs found on server for this load.");
              }else{alert("No docs found on server for this load.");}
            }).catch(()=>alert("Sync failed — check connection."));
          }}>🔄 Sync Docs</button>
          <button className="btn btn-s btn-sm" onClick={onClose}>✕ Close</button>
        </div>
      </div>
      <div className="two-col">
        <div>
          <div style={{fontSize:11,color:"var(--mu)",marginBottom:8,fontWeight:600}}>ROUTE</div>
          <div style={{fontSize:12,lineHeight:2}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 16px"}}>
              <div>📍 From: <strong>{load.pickup}</strong></div>
              <div>📍 To: <strong>{load.delivery}</strong></div>
              <div>📅 PU: <strong>{load.pu}</strong>{load.puTime&&<span style={{color:"var(--mu)",marginLeft:6,fontSize:11}}>🕐 {load.puTime}</span>}</div>
              <div>📅 DLV: <strong>{load.dlv}</strong>{load.dlvTime&&<span style={{color:"var(--mu)",marginLeft:6,fontSize:11}}>🕐 {load.dlvTime}</span>}</div>
              <div>💵 Amount: <strong style={{color:"var(--green)"}}>${load.amount?.toLocaleString()}</strong></div>
              <div>📏 Miles: <strong>{load.miles||"—"}</strong>{load.miles&&load.amount?<span style={{color:"var(--acc)",marginLeft:6,fontSize:11}}>${(load.amount/load.miles).toFixed(2)}/mi</span>:""}</div>
              <div>🚛 Driver: <strong>{load.driver||"—"}</strong></div>
              <div>🏭 Carrier: <strong>{load.carrier||"—"}</strong></div>
              <div>📦 Type: <strong>{load.loadType||"—"}</strong></div>
              <div>👤 Dispatcher: <strong>{load.dispatcher||"—"}</strong></div>
              <div>🏢 Broker: <strong>{load.broker||"—"}</strong></div>
              <div>🔢 Broker MC: <strong style={{fontFamily:"monospace"}}>{load.brokerMC||"—"}</strong></div>
              <div>📧 Broker Email: <strong>{load.brokerEmail||"—"}</strong></div>
              {load.brokerPhone&&<div>📞 Broker Tel: <strong>{load.brokerPhone}</strong></div>}
              <div>🔖 Load #: <strong style={{fontFamily:"monospace"}}>{load.loadNum||"—"}</strong></div>
              <div>✅ Factoring: <strong style={{color:load.factoring==="YES"?"var(--green)":"var(--mu)"}}>{load.factoring||"NO"}</strong></div>
            </div>
            {load.exNote&&<div style={{marginTop:8,padding:"8px 10px",background:"rgba(239,68,68,.07)",border:"1px solid rgba(239,68,68,.2)",borderRadius:6,fontSize:11,color:"var(--red)"}}>⚠️ Exception: {load.exNote}</div>}
          </div>
          <div style={{marginTop:12}}><label>Notes</label><textarea style={{marginTop:5}} rows={3} value={notes} onChange={e=>sn(e.target.value)}/><button className="btn btn-p btn-sm" style={{marginTop:6}} onClick={save}>{saved?"✓ Saved":"Save"}</button></div>
        </div>
        <div>
          <div style={{fontSize:11,color:"var(--mu)",marginBottom:8,fontWeight:600}}>DOCUMENTS</div>
          {/* Rate Con */}
          <div style={{marginBottom:12}}>
            <div style={{fontSize:12,fontWeight:600,marginBottom:6}}>📄 Rate Con</div>
            {load.rateCon&&load.rateCon.length>5?(
              <div style={{background:"var(--sf)",border:"1px solid var(--b)",borderRadius:8,padding:"10px 12px",display:"flex",alignItems:"center",gap:10}}>
                {!load.rateCon.endsWith(".pdf")&&<img src={load.rateCon.startsWith("http")?load.rateCon:""} alt="rc" style={{width:48,height:48,objectFit:"cover",borderRadius:5,display:load.rateCon.startsWith("http")?"block":"none"}} onError={e=>e.target.style.display="none"}/>}
                {load.rateCon.endsWith(".pdf")&&<span style={{fontSize:24}}>📄</span>}
                <div style={{flex:1}}><span className="bdg bg" style={{display:"block",marginBottom:4}}>✓ Uploaded</span>
                  <div style={{display:"flex",gap:6}}>
                    <button onClick={()=>openDoc(load.rateCon)} style={{background:"none",border:"none",color:"var(--blue)",cursor:"pointer",fontSize:11,padding:0,textDecoration:"underline"}}>View</button>
                    <button onClick={()=>downloadDoc(load.rateCon,"RateCon_"+load.loadNum)} className="btn btn-s btn-sm" style={{fontSize:10}}>⬇ Download</button>
                  </div>
                </div>
                <button onClick={()=>{
                  saveDoc(load.id,"rc","");
                  try{const k="vs4_du_"+load.id;const ex=JSON.parse(localStorage.getItem(k)||"{}");delete ex.rc;delete ex.rateCon;localStorage.setItem(k,JSON.stringify(ex));dbSet(k,ex);}catch{}
                  onUpdate(load.id,{rateCon:""});
                  onFile(load.id,"rateCon","");
                }} style={{background:"rgba(239,68,68,.1)",border:"1px solid rgba(239,68,68,.3)",color:"var(--red)",borderRadius:4,padding:"2px 7px",cursor:"pointer",fontSize:11}}>✕</button>

            ):(
              <div className="uzone"><input type="file" accept="image/*,application/pdf" onChange={e=>hFile("rateCon",e)}/><div style={{fontSize:22,marginBottom:4}}>📄</div><div style={{fontSize:12,color:"var(--mu)"}}>Tap to upload Rate Con</div></div>
            )}
          </div>
          {/* POD — multiple */}
          <div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
              <div style={{fontSize:12,fontWeight:600}}>📦 POD <span style={{fontSize:10,color:"var(--mu)",fontWeight:400}}>{podList.length>0?"("+podList.length+" doc"+(podList.length>1?"s":"")+")":""}</span></div>

                    {p.endsWith(".pdf")?<span style={{fontSize:28,flexShrink:0}}>📄</span>:<img src={p} alt={"pod"+i} style={{width:40,height:40,objectFit:"cover",borderRadius:4,background:"#fff",flexShrink:0}} onError={e=>e.target.style.display="none"}/>}

// ADD LOAD
function AddLoad({ctx,setTab,Mob}){
  const{loads,setLoads,carriers,drivers,sess,apiKey}=ctx;
  const blank={loadNum:"",carrier:"",driver:"",pickup:"",delivery:"",pu:"",dlv:"",puTime:"",dlvTime:"",amount:"",miles:"",dh:"",factoring:"NO",status:"",dispatcher:sess.name,broker:"",brokerMC:"",brokerEmail:"",brokerPhone:"",notes:"",loadType:"Dry Van",poNote:"",pct:(sess.pct??3),rateCon:"",pod:""};
  const[f,sf]=useState(blank);
  const[warn,sw]=useState("");
  const[ok,so]=useState(false);
  const[aiLoad,sal]=useState(false);
  const[rcPrev,srcp]=useState([]);
  const[rcText,srt]=useState("");
  const ts=nowTS();
  const cObj=carriers.find(c=>c.name===f.carrier);
  const drvs=cObj?drivers.filter(d=>d.carrier===f.carrier):[];
  const isPO=f.loadType==="Power Only";
  const set=(k,v)=>{
    if(k==="broker"&&f.carrier){const hit=cObj?.bl?.find(b=>{const bn=typeof b==="string"?b:(b.name||"");const bmc=typeof b==="string"?"":b.mc||"";return (bn.toLowerCase().includes(v.toLowerCase())&&v.length>2)||(bmc&&bmc===v.trim());});sw(hit?"⛔ \""+v+"\" is BLACKLISTED for "+f.carrier+"!":" ");}
    if(k==="carrier"){sw("");sf(x=>({...x,driver:"",[k]:v}));return;}
    sf(x=>({...x,[k]:v}));
  };
  const dh=parseFloat(f.dh)||0,miles=parseFloat(f.miles)||0,amt=parseFloat(f.amount)||0;
  const eff=miles+dh,rpm=miles&&amt?(amt/miles).toFixed(2):null,effRpm=eff&&amt?(amt/eff).toFixed(2):null;
  const mn=f.loadType==="Reefer"?3:2,rpmOk=effRpm&&parseFloat(effRpm)>=mn;

  const parseRateCon=(text)=>{
    const tl=text.replace(/\r\n/g,'\n').replace(/[ \t]+/g,' ');
    const find=(pats,def="")=>{for(const p of pats){const m=tl.match(p);if(m&&(m[1]||"").trim())return(m[1]||"").trim();}return def;};
    const findNum=(pats)=>{for(const p of pats){const m=tl.match(p);if(m)return parseFloat((m[1]||"0").replace(/[$,]/g,""))||"";}return "";};
    const fmtDate=(s)=>{if(!s)return"";let m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return m[3]+"-"+m[1].padStart(2,"0")+"-"+m[2].padStart(2,"0");m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{2})/);if(m)return"20"+m[3]+"-"+m[1].padStart(2,"0")+"-"+m[2].padStart(2,"0");return"";};
    const isTQL=/TQL|TOTAL QUALITY/i.test(tl);
    const isJRC=/JRC.LOGISTICS|JRC-LOGISTICS/i.test(tl);
    const isGFL=/GREEN FREIGHT|greenfreightlog/i.test(tl);
    const isROAR=/ROAR LOGISTICS/i.test(tl);
    const isFTUSA=/FREEDOM TRANS/i.test(tl);

    // ── LOAD NUMBER ───────────────────────────────────────────────────────────
    let loadNum="";
    if(isTQL) loadNum=find([/CONFIRMATION FOR PO#\s*([\d\w-]+)/i,/PO#\s*([\d\w-]+)/i]);
    else if(isJRC) loadNum=find([/LEG\s*#\s*([\d\w-]+)/i,/LOAD\s*#\s*([\d\w-]+)/i]);
    else if(isGFL) loadNum=find([/PRO\s*#\s*([\d]{4,6})/i]);
    else if(isROAR) loadNum=find([/Shipment\s*#\s*([\d]+)/i]);
    else if(isFTUSA) loadNum=find([/Load Confirmation\s+([\d]+)/i,/Order:\s*([\d]+)/i,/\b(0\d{6,7})\b/]);
    else loadNum=find([/LEG\s*#\s*([\d\w-]+)/i,/PRO\s*#\s*([\d]{4,6})/i,/PO#\s*([\d\w-]+)/i,/LOAD\s*#\s*([\d\w-]+)/i,/Shipment\s*#\s*([\d]+)/i,/Order:\s*([\d]+)/i,/Reference\s*#\s*([\d\w-]+)/i]);

      /Total Pay[:\s]+\$\s*([\d,]+\.?\d*)/i,

    // Amount must be >= 100; scan all dollar amounts and take largest if needed

      if(allAmts[0])amount=allAmts[0];

    // ── MILES ─────────────────────────────────────────────────────────────────
    const miles=findNum([/\bMiles[:\s]+([\d.]+)/i,/Shipment Miles\s+([\d.]+)/i,/Miles:\s+([\d.]+)/i]);

    // ── BROKER ────────────────────────────────────────────────────────────────
    let broker="";
    if(isTQL)broker="Total Quality Logistics (TQL)";
    else if(isJRC)broker="JRC Logistics";
    else if(isGFL)broker="Green Freight Logistics LLC";
    else if(isROAR)broker="ROAR Logistics";
    else if(isFTUSA)broker="Freedom Trans USA, LLC";
    else broker=find([/([A-Z][A-Za-z]+(?: [A-Z][A-Za-z]+)* (?:GLOBAL )?(?:LOGISTICS|TRANSPORT|FREIGHT|TRUCKING|CARRIERS)[A-Za-z ,.]*(?: LLC| INC| CORP| LTD)?)/i,/(TQL|Echo Global|Coyote|XPO|Arrive|Moonshot)/i]);

    const brokerPhone=find([/\(678\) 207-0710/,/(\d{3}[-.\s]\d{3}[-.\s]\d{4}(?:\s*[xX]\d+)?)/]);
    const brokerEmail=find([/([\w.+-]+@[\w-]+\.[a-zA-Z]{2,})/i]);
    const brokerMC=find([/MC[:\s#\/]+(\d{5,7})/i,/MC#\s*([\d]+)/i]);

    // ── PICKUP & DELIVERY ────────────────────────────────────────────────────
    let pickup="",delivery="",puDateRaw="",dlvDateRaw="";
    if(isTQL){
      const puM=tl.match(/Pick-?up Location\s+([A-Za-z][A-Za-z\s,]+?)\s+(\d{1,2}\/\d{1,2}\/\d{4})/i);
      if(puM){pickup=puM[1].trim();puDateRaw=puM[2];}
      const dlM=tl.match(/Delivery Location\s+([A-Za-z][A-Za-z\s,]+?)\s+(\d{1,2}\/\d{1,2}\/\d{4})/i);
      if(dlM){delivery=dlM[1].trim();dlvDateRaw=dlM[2];}
    }else if(isJRC){
      const cszPat=/([A-Z][a-zA-Z\s]+,\s*[A-Z]{2}\s+\d{5})/g;
      const cities=[...tl.matchAll(cszPat)].map(m=>m[1].trim());
      if(cities[0])pickup=cities[0];if(cities[1]&&cities[1]!==cities[0])delivery=cities[1];
      const dates=[...tl.matchAll(/(\d{1,2}\/\d{1,2}\/\d{4})/g)].map(m=>m[1]);
      if(dates[0])puDateRaw=dates[0];if(dates[1])dlvDateRaw=dates[1];
    }else if(isGFL){
      const pickM=tl.match(/PICK\s+\d+[\s\S]*?([A-Z][A-Z\s]+[A-Z]{2}\s+\d{5})\s*Appointment\s+(\d{2}\/\d{2}\/\d{2})/i);
      if(pickM){pickup=pickM[1].trim();puDateRaw=pickM[2];}
      const stopM=tl.match(/STOP\s+\d+[\s\S]*?([A-Z][A-Z\s]+[A-Z]{2}\s+\d{5})\s*Appointment\s+(\d{2}\/\d{2}\/\d{2})/i);
      if(stopM){delivery=stopM[1].trim();dlvDateRaw=stopM[2];}
    }else if(isFTUSA){
      // Freedom Trans USA: "NATCHITOCHES LA 71457" and "SAN ANTONIO TX 78218" on PU1/SO2 lines
      const puM=tl.match(/PU\s*1[\s\S]*?([A-Z]{3,}(?:\s+[A-Z]+)*\s+[A-Z]{2}\s+\d{5})/i);
      if(puM)pickup=puM[1].trim();
      const soM=tl.match(/SO\s*2[\s\S]*?([A-Z]{3,}(?:\s+[A-Z]+)*\s+[A-Z]{2}\s+\d{5})/i);
      if(soM)delivery=soM[1].trim();
      // Dates: "04/30/2026" style
      const datesAll=[...tl.matchAll(/(\d{2}\/\d{2}\/\d{4})/g)].map(m=>m[1]);
      if(datesAll[0])puDateRaw=datesAll[0];
      const dlvCandidates=datesAll.filter(d=>d!==puDateRaw);
      if(dlvCandidates[0])dlvDateRaw=dlvCandidates[0];
    }else if(isROAR){
      const puM=tl.match(/Pickup[\s\S]*?([A-Z][a-zA-Z\s]+,\s*[A-Z]{2},?\s*\d{5})[\s\S]*?Scheduled\s+(\d{1,2}\/\d{1,2}\/\d{2})/i);
      if(puM){pickup=puM[1].trim();puDateRaw=puM[2];}
      const dlM=tl.match(/Delivery[\s\S]*?([A-Z][a-zA-Z\s]+,\s*[A-Z]{2},?\s*\d{5})[\s\S]*?Scheduled\s+(\d{1,2}\/\d{1,2}\/\d{2})/i);
      if(dlM){delivery=dlM[1].trim();dlvDateRaw=dlM[2];}
    }
    // Generic fallback for cities
    if(!pickup||!delivery){
      const mixed=[...tl.matchAll(/([A-Z][a-zA-Z\s]{2,20},\s*[A-Z]{2}(?:\s+\d{5})?)/g)].map(m=>m[1].trim()).filter(c=>c.length>5&&c.length<40&&!/^(CARRIER|DRIVER|BROKER|FLAT|LOAD|RATE|ROUTE|NOTE|PLEASE)/i.test(c));
      const uniq=[...new Set(mixed)];
      if(!pickup&&uniq[0])pickup=uniq[0];
      if(!delivery){const last=uniq.filter(u=>u!==pickup).pop();if(last)delivery=last;}
    }
    // Generic date fallback
    const allDates=[...tl.matchAll(/(\d{1,2}\/\d{1,2}\/(?:\d{4}|\d{2}))/g)].map(m=>m[1]);
    if(!puDateRaw&&allDates[0])puDateRaw=allDates[0];
    if(!dlvDateRaw){const d2=allDates.find((d,i)=>i>0&&d!==allDates[0]);if(d2)dlvDateRaw=d2;}

    // ── LOAD TYPE ─────────────────────────────────────────────────────────────
    const hasPO=/POWER\s*ONLY/i.test(tl);
    const hasR=/\b(Reefer|Refrigerated|PO Reefer|Temperature Controlled|DAT.*reefer)\b/i.test(tl);
    const hasF=/\bFlatbed\b/i.test(tl);

    const allZips=[...tl.matchAll(/\b(\d{5})\b/g)].map(m=>m[1]);
    const pickupZip=pickup?.match(/\b(\d{5})\b/)?.[1]||allZips[0]||"";
    const deliveryZip=delivery?.match(/\b(\d{5})\b/)?.[1]||(allZips[1]!==pickupZip?allZips[1]:allZips[2])||"";

    return{loadNum:loadNum.trim(),pickup:pickup.replace(/\s+/g," ").trim(),delivery:delivery.replace(/\s+/g," ").trim(),pu:fmtDate(puDateRaw),dlv:fmtDate(dlvDateRaw),puTime:"",dlvTime:"",amount,miles,broker,brokerMC,brokerEmail,brokerPhone,loadType,pickupZip,deliveryZip};

  const handleRateCon=async(e)=>{

      if(extractedText.length>80){

            loadNum:local.loadNum||x.loadNum,pickup:local.pickup||x.pickup,delivery:local.delivery||x.delivery,
            pu:local.pu||x.pu,dlv:local.dlv||x.dlv,puTime:local.puTime||x.puTime,dlvTime:local.dlvTime||x.dlvTime,

Return ONLY the JSON object.`;
        const res=await fetch("https://api.anthropic.com/v1/messages",{
          method:"POST",
          headers:{"Content-Type":"application/json","anthropic-dangerous-direct-browser-access":"true","x-api-key":apiKey,"anthropic-version":"2023-06-01"},
          body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:1500,messages:[{role:"user",content:[...imgBlocks,{type:"text",text:prompt}]}]})
        });
        const d2=await res.json();
        if(d2.error){throw new Error(d2.error.message||"API error");}
        const rawTxt=d2.content?.find(x=>x.type==="text")?.text||"{}";
        let p={};

          p={loadNum:grab("loadNum"),broker:grab("broker"),pickup:grab("pickup"),delivery:grab("delivery"),puDate:grab("puDate"),dlvDate:grab("dlvDate"),amount:grabN("amount"),miles:grabN("miles"),loadType:grab("loadType","Dry Van"),brokerMC:grab("brokerMC"),brokerEmail:grab("brokerEmail"),brokerPhone:grab("brokerPhone"),driver:grab("driver")};

            amount:p.amount>=100?p.amount:x.amount,miles:p.miles||x.miles,

  };

            </div>}

// CSV IMPORT
function CSVImport({ctx,setTab}){
  const[prev,sp]=useState([]);const[err,se]=useState("");const[done,sd]=useState(false);
  const hf=e=>{
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();r.onload=ev=>{
      try{
        const lines=ev.target.result.split("\n").filter(l=>l.trim());
        const hdrs=lines[0].split(",").map(h=>h.trim().replace(/"/g,"").toLowerCase());
        const rows=lines.slice(1).map(line=>{const vals=line.split(",").map(v=>v.trim().replace(/"/g,""));const o={};hdrs.forEach((h,i)=>{o[h]=vals[i]||""});return o}).filter(r=>r["load number"]||r["load #"]||r["loadnum"]);
        sp(rows);se("");
      }catch(e){se("Could not parse CSV.")}
    };r.readAsText(file);
  };
  const doImport=()=>{
    const ts=nowTS();
    const mapped=prev.map(r=>({id:Date.now()+Math.random(),ts,date:ts.slice(0,10),loadNum:r["load number"]||r["load #"]||r["loadnum"]||"",carrier:r["carrier name"]||r["carrier"]||"",driver:r["driver name"]||r["driver"]||"",pickup:r["pick up city/state"]||r["pickup"]||"",delivery:r["delivery city/state"]||r["delivery"]||"",pu:r["pick up date"]||r["pickup date"]||"",dlv:r["delivery date"]||"",amount:parseFloat(r["amount"])||0,miles:parseFloat(r["# of miles"]||r["miles"])||null,dh:0,factoring:r["factoring?"]||"YES",status:"Delivered",dispatcher:r["dispatcher name"]||r["dispatcher"]||"",broker:r["brokerage name"]||r["broker"]||"",brokerMC:r["broker mc"]||"",brokerEmail:r["broker email"]||"",brokerPhone:r["broker number"]||"",notes:r["comments"]||"",loadType:"Dry Van",pod:"",rateCon:"",exNote:"",cancelled:false,pct:parseFloat(r["percentage"])||3}));
    ctx.setLoads([...ctx.loads,...mapped]);sd(true);
  };
  return(<>
    <div className="tb"><div><div className="pt">Import CSV</div><div className="ps">Upload Google Sheets export</div></div></div>
    <div className="con">
      {done&&<div className="al als">✅ {prev.length} loads imported! <button className="btn btn-s btn-sm" style={{marginLeft:8}} onClick={()=>setTab("loads")}>View Board</button></div>}
      <div className="al ali">Export your Load Submissions sheet: File → Download → Comma Separated Values (.csv), then upload here.</div>
      <div className="card" style={{maxWidth:600}}>
        <div className="uzone" style={{marginBottom:14}}><input type="file" accept=".csv,text/csv" onChange={hf}/><div style={{fontSize:28,marginBottom:6}}>📊</div><div style={{fontSize:13,fontWeight:600}}>Tap to select CSV file</div><div style={{fontSize:11,color:"var(--mu)",marginTop:3}}>From Google Sheets Load Submissions</div></div>
        {err&&<div className="al ald">{err}</div>}
        {prev.length>0&&<>
          <div style={{fontSize:12,fontWeight:600,marginBottom:8}}>Preview: {prev.length} rows found</div>
          <div className="tw" style={{marginBottom:12,maxHeight:200,overflow:"auto"}}><table><thead><tr>{Object.keys(prev[0]).slice(0,5).map(h=><th key={h}>{h}</th>)}</tr></thead><tbody>{prev.slice(0,3).map((r,i)=><tr key={i}>{Object.keys(r).slice(0,5).map(k=><td key={k} style={{fontSize:10}}>{r[k]}</td>)}</tr>)}</tbody></table></div>
          <button className="btn btn-p" style={{width:"100%"}} onClick={doImport}>Import {prev.length} Loads →</button>
        </>}

    </div>
  </>);
}

// AI FACTORING
function AIFact({ctx}){
  const{loads,setLoads,apiKey}=ctx;
  const[tab,setTab]=useState("submit");
  const[factType,setFactType]=useState("");
  const[rc,setRc]=useState(null);
  const[pods,setPods]=useState([]);
  const[parsing,setParsing]=useState(false);
  const[parsed,setParsed]=useState(null);
  const[mismatch,setMismatch]=useState(null);
  const[submitted,setSubmitted]=useState(false);
  const[err,setErr]=useState("");
  const[fields,setFields]=useState({invoiceNum:"",driver:"",linehaul:"",billTo:"",equipType:"Dry Van",notes:"",truckNum:"",trailerNum:"",pickupZip:"",deliveryZip:""});
  const[selLoadId,setSelLoadId]=useState("");
  const unfactored=loads.filter(l=>l.factoring!=="YES"&&(getAutoStatus(l)==="Delivered"||l.status==="Delivered"));
  const selLoad=loads.find(l=>String(l.id)===String(selLoadId));
  React.useEffect(()=>{
    if(!selLoad)return;
    if(selLoad.rateCon&&selLoad.rateCon.length>10)setRc({dataUrl:selLoad.rateCon,name:"RC-"+selLoad.loadNum,preview:selLoad.rateCon,text:""});
    else setRc(null);
    const podArr=getPodList(selLoad);
    setPods(podArr.map((d,i)=>({dataUrl:d,name:"POD-"+selLoad.loadNum+"-p"+(i+1),preview:d,text:""})));
    setParsed(null);setMismatch(null);setErr("");setSubmitted(false);
  },[selLoadId]);

  const renderPDF=async(file)=>{
    const reader=new FileReader();
    return new Promise(res=>{
      reader.onload=async(ev)=>{
        const dataUrl=ev.target.result;
        const obj={dataUrl,name:file.name,preview:null,text:""};
        try{
          if(!window.pdfjsLib){
            await new Promise((ok,fail)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";s.onload=ok;s.onerror=fail;document.head.appendChild(s)});
            window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
          }
          const bytes=atob(dataUrl.split(",")[1]);
          const arr=new Uint8Array(bytes.length);
          for(let i=0;i<bytes.length;i++)arr[i]=bytes.charCodeAt(i);
          const pdf=await window.pdfjsLib.getDocument({data:arr}).promise;
          const pg=await pdf.getPage(1);
          const vp=pg.getViewport({scale:1.6});
          const cv=document.createElement("canvas");cv.width=vp.width;cv.height=vp.height;
          const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);
          await pg.render({canvasContext:cx,viewport:vp}).promise;
          obj.preview=cv.toDataURL("image/jpeg",0.85);
          let txt="";
          for(let i=1;i<=Math.min(pdf.numPages,3);i++){
            const p=await pdf.getPage(i);
            const tc=await p.getTextContent({normalizeWhitespace:true});
            const raw=tc.items.map(x=>x.str).join(" ");
            const valid=(raw.match(/[a-zA-Z0-9$.,@\/#\-\s]/g)||[]).length;
            if(!raw.replace(/\s/g,"").length||valid/raw.replace(/\s/g,"").length>0.5)txt+=raw+" ";
          }
          obj.text=txt.trim();
        }catch(e){obj.preview=dataUrl;}
        res(obj);
      };
      reader.readAsDataURL(file);
    });
  };

  const handleFile=async(type,e)=>{
    const files=Array.from(e.target.files);if(!files.length)return;
    if(type==="rc"){
      const obj=await renderPDF(files[0]);
      setRc({...obj,localDataUrl:obj.dataUrl});
      // Upload in background
      uploadDoc(obj.dataUrl,"rc/"+Date.now()+"_"+Math.random().toString(36).slice(2)).then(url=>{
        if(url!==obj.dataUrl)setRc(prev=>({...prev,dataUrl:url}));
      });
    }else{
      const newObjs=await Promise.all(files.map(f=>renderPDF(f)));
      setPods(prev=>[...prev,...newObjs.map(o=>({...o,localDataUrl:o.dataUrl}))]);
      // Upload each in background
      newObjs.forEach(obj=>{
        uploadDoc(obj.dataUrl,"pod/"+Date.now()+"_"+Math.random().toString(36).slice(2)).then(url=>{
          if(url!==obj.dataUrl)setPods(prev=>prev.map(p=>p.localDataUrl===obj.dataUrl?{...p,dataUrl:url}:p));
        });
      });
    }
    setParsed(null);setMismatch(null);setErr("");setSubmitted(false);
  };

  const analyze=async()=>{
    if(!rc||!pods.length){alert("Upload Rate Con and at least one POD first.");return;}
    if(!factType){alert("Select RTS or TAFS first.");return;}
    setParsing(true);setErr("");
    if(!apiKey){setErr("No API key set — paste your Claude API key in the sidebar (bottom left).");setParsing(false);return;}
    try{
      // Convert doc (base64 or Storage URL) to Claude API block
      const toBlock=async(obj)=>{
        // Prefer local base64 if available (faster, no re-fetch)
        const d=obj.localDataUrl||obj.dataUrl||"";
        if(d.startsWith("data:")){
          const isPDF=d.startsWith("data:application/pdf");
          if(isPDF)return{type:"document",source:{type:"base64",media_type:"application/pdf",data:d.split(",")[1]}};
          const mediaType=d.match(/:(.*?);/)?.[1]||"image/jpeg";
          return{type:"image",source:{type:"base64",media_type:mediaType,data:d.split(",")[1]}};
        }
        // It's a Storage URL — images can use URL type directly
        const isImg=/\.(jpg|jpeg|png|gif|webp)(\?|$)/i.test(d);
        if(isImg)return{type:"image",source:{type:"url",url:d}};
        // PDF URL — fetch and re-encode
        const resp=await fetch(d);const blob=await resp.blob();
        const b64=await new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result.split(",")[1]);r.readAsDataURL(blob);});
        return{type:"document",source:{type:"base64",media_type:"application/pdf",data:b64}};
      };
      // POD docs still sent as full images/PDFs for visual verification
      const podBlocks=await Promise.all(pods.map(p=>toBlock(p)));
      // RC is NOT re-sent as a raw PDF — we already extracted it; use text to save ~1-2M tokens
      const rcSummary=rc.text&&rc.text.length>50
        ?rc.text.slice(0,3000)
        :`Load#: ${fields.invoiceNum||""} | Carrier Pay: $${fields.linehaul||""} | Broker: ${fields.billTo||""} | Driver: ${fields.driver||""} | Equipment: ${fields.equipType||""} | Pickup ZIP: ${fields.pickupZip||""} | Delivery ZIP: ${fields.deliveryZip||""}${parsed?" | Full extracted data: "+JSON.stringify(parsed):""}`;
      const msgContent=[{type:"text",text:"RATE CONFIRMATION (already extracted — do not re-read from image):\n"+rcSummary}];
      pods.forEach((p,i)=>{
        msgContent.push({type:"text",text:`PROOF OF DELIVERY (doc ${i+1} of ${pods.length}):`});
        msgContent.push(podBlocks[i]);
      });
      const prompt=`You are a freight factoring assistant. Rate Con: ${rc.name}. POD docs (${pods.length} total): ${pods.map(p=>p.name).join(", ")}.\n\nExtract all fields from the Rate Confirmation and verify the POD docs match it.\nReturn ONLY a valid JSON object — no markdown, no explanation.\n\nFields:\n- loadNum: Load/PO/PRO/Reference/Confirmation number. NEVER leave empty.\n- amount: Total carrier pay as a plain number (100-99999). NEVER return 0.\n- broker, brokerMC, brokerEmail, brokerPhone\n- carrier, carrierMC, driver\n- pickup, pickupZip, delivery, deliveryZip\n- puDate (YYYY-MM-DD), dlvDate (YYYY-MM-DD), puTime (HH:MM), dlvTime (HH:MM)\n- equipType: exactly one of "Dry Van","Reefer","Flatbed","Power Only"\n- commodity, weight, temperature, truckNum, trailerNum\n- podLocationMatch: true if POD delivery location matches Rate Con\n- podDateMatch: true if POD date matches Rate Con delivery date\n- podDriverMatch: true if driver matches (or not shown on both)\n- podMismatchDetails: explanation ONLY if real mismatch, else empty string\n- podNotes: observations (signatures, damage, number of POD pages, etc.)\n\nReturn ONLY the JSON object.`;
      msgContent.push({type:"text",text:prompt});
      const res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json","anthropic-dangerous-direct-browser-access":"true","x-api-key":apiKey,"anthropic-version":"2023-06-01"},
        body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:2000,messages:[{role:"user",content:msgContent}]})
      });
      const d=await res.json();
      if(d.error){throw new Error(d.error.message||"API error");}
      const txt=d.content?.find(x=>x.type==="text")?.text||"{}";
      let p={};
      try{
        const clean=txt.replace(/^```json\s*/,"").replace(/```\s*$/,"").trim();
        const openB=(clean.match(/\{/g)||[]).length,closeB=(clean.match(/\}/g)||[]).length;
        const fixd=openB>closeB?clean+"}".repeat(openB-closeB):clean;
        p=JSON.parse(fixd);
      }catch{
        const grab=(key,fb="")=>{const m=txt.match(new RegExp('"'+key+'"\\s*:\\s*"([^"]*)"'));return m?m[1]:fb;};
        const grabN=(key)=>{const m=txt.match(new RegExp('"'+key+'"\\s*:\\s*([\\d.]+)'));return m?parseFloat(m[1]):0;};
        p={loadNum:grab("loadNum"),amount:grabN("amount"),broker:grab("broker"),pickup:grab("pickup"),delivery:grab("delivery"),puDate:grab("puDate"),dlvDate:grab("dlvDate"),equipType:grab("equipType","Dry Van"),driver:grab("driver"),podLocationMatch:true,podMismatchDetails:"",podNotes:""};
      }
      if(!p.loadNum&&rc.name){const fnMatch=rc.name.match(/[A-Z]?\d{6,12}/);if(fnMatch)p.loadNum=fnMatch[0];}
      const hasMismatch=p.podLocationMatch===false&&p.podMismatchDetails&&p.podMismatchDetails.length>5;
      setParsed(p);
      setFields(f=>({...f,invoiceNum:p.loadNum||"",linehaul:p.amount?String(p.amount):"",billTo:p.broker||"",driver:p.driver||"",equipType:p.equipType||"Dry Van",truckNum:p.truckNum||"",trailerNum:p.trailerNum||"",pickupZip:p.pickupZip||"",deliveryZip:p.deliveryZip||""}));
      setMismatch(hasMismatch?{detail:p.podMismatchDetails}:null);
    }catch(e){
      setErr("API error: "+e.message+". Check your connection and try again.");
    }
    setParsing(false);
  };

  const saveToLoad=()=>{
    if(!parsed)return;
    const match=loads.find(l=>l.loadNum===parsed.loadNum);
    const podDataUrls=pods.map(p=>p.dataUrl);
    if(match){
      const rcUrl=rc?.dataUrl||match.rateCon||"";
      if(rcUrl&&rcUrl.length>5)saveDoc(match.id,"rc",rcUrl);
      if(podDataUrls.length>0)savePods(match.id,podDataUrls);
      setLoads(loads.map(l=>l.id===match.id?{...l,rateCon:rcUrl,pods:podDataUrls,pod:podDataUrls[0]||l.pod,factoring:"YES"}:l));
      alert("Load "+parsed.loadNum+" updated and marked factored.");
    }else alert("Load #"+parsed.loadNum+" not found. Fill form and submit to factoring portal.");
    setSubmitted(true);
  };

  const factoredLoads=loads.filter(l=>l.rateCon||hasPod(l));
  const set=k=>e=>setFields(f=>({...f,[k]:e.target.value}));
  const ro={readOnly:true,style:{opacity:.7}};

  return(<>
    <div className="tb">
      <div><div className="pt">AI Factoring</div><div className="ps">Upload Rate Con + POD → match check → fill factoring form</div></div>
      <div style={{display:"flex",gap:6}}>
        <button className="btn" style={{background:tab==="submit"?"var(--acc)":"var(--b)",color:tab==="submit"?"#000":"var(--tx)",padding:"7px 14px"}} onClick={()=>setTab("submit")}>Submit Invoice</button>
        <button className="btn" style={{background:tab==="dash"?"var(--acc)":"var(--b)",color:tab==="dash"?"#000":"var(--tx)",padding:"7px 14px"}} onClick={()=>setTab("dash")}>Docs Dashboard {factoredLoads.length>0&&"("+factoredLoads.length+")"}</button>
      </div>
    </div>

// INVOICES
function Invoices({ctx}){
  const{loads,carriers,invoices,setInv,sess}=ctx;
  const[tab,setTab]=useState("build");
  const[sel,ss]=useState([]);
  const[prev,sp]=useState(false);
  const[carrFilter,setCF]=useState("ALL");
  const[invDateFrom,setIDF]=useState("");const[invDateTo,setIDT]=useState("");
  const[showDriver,setShowDriver]=useState(true);
  const[showMiles,setShowMiles]=useState(false);
  const today=new Date();
  const todayStr=today.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});
  const monthYear=today.toLocaleDateString("en-US",{month:"long",year:"numeric"});
  const invNum="INV-"+String(((invoices||[]).length+1)).padStart(6,"0");

  // Delivered loads not yet invoiced
  const delivered=loads.filter(l=>(getAutoStatus(l)==="Delivered"||l.status==="Delivered")&&!l.cancelled);
  const alreadyInvoiced=new Set((invoices||[]).flatMap(i=>i.loadIds||[]));
  const available=delivered.filter(l=>!alreadyInvoiced.has(l.id));
  const shown=(carrFilter==="ALL"?available:available.filter(l=>l.carrier===carrFilter)).filter(l=>{
    if(!invDateFrom&&!invDateTo)return true;
    const ts=l.ts||l.date||"";if(!ts)return !invDateFrom;
    const d=ts.slice(0,10);
    if(invDateFrom&&d<invDateFrom)return false;
    if(invDateTo&&d>invDateTo)return false;
    return true;
  });

  const sl=loads.filter(l=>sel.includes(l.id));
  const tot=sl.reduce((s,l)=>s+(l.amount||0),0);
  const CARRIER_PCT=3;
  const fee=+sl.reduce((s,l)=>s+(l.amount||0)*CARRIER_PCT/100,0).toFixed(2);
  const pct=CARRIER_PCT;
  // carriers represented in selection
  const selCarriers=[...new Set(sl.map(l=>l.carrier).filter(Boolean))];

  const tog=(id)=>ss(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  const quickSelect=(carr)=>{
    const ids=available.filter(l=>{
      const carrMatch=carr==="ALL"?true:Array.isArray(carr)?carr.includes(l.carrier):l.carrier===carr;
      if(!carrMatch)return false;
      if(!invDateFrom&&!invDateTo)return true;
      const ts=l.ts||l.date||"";if(!ts)return !invDateFrom;
      const d=ts.slice(0,10);
      if(invDateFrom&&d<invDateFrom)return false;
      if(invDateTo&&d>invDateTo)return false;
      return true;
    }).map(l=>l.id);
    ss(prev=>{const has=ids.every(id=>prev.includes(id));return has?prev.filter(id=>!ids.includes(id)):[...new Set([...prev,...ids])];});
  };

  const togRec=(id)=>setInv((invoices||[]).map(i=>i.id===id?{...i,received:!i.received}:i));
  const submitInv=(id)=>setInv((invoices||[]).map(i=>i.id===id?{...i,submitted:true,submittedDate:todayStr}:i));
  const returnInv=(id)=>setInv((invoices||[]).map(i=>i.id===id?{...i,submitted:false,returned:true,returnedDate:todayStr}:i));
  const deleteInv=(id)=>{ if(window.confirm("Delete this invoice?"))setInv((invoices||[]).filter(i=>i.id!==id)); };

  const gen=()=>{
    if(!sl.length){alert("Select at least one load.");return;}
    setInv([...(invoices||[]),{id:Date.now(),num:invNum,carrier:selCarriers.join(" + "),carriers:selCarriers,amount:fee,loadTotal:tot,date:todayStr,received:false,submitted:false,returned:false,loadIds:sel,pct}]);
    sp(true);
  };

  const pending=(invoices||[]).filter(i=>!i.submitted&&!i.returned);
  const submitted=(invoices||[]).filter(i=>i.submitted);
  const returned=(invoices||[]).filter(i=>i.returned);
  const due=(invoices||[]).filter(i=>!i.received).reduce((s,i)=>s+(i.amount||0),0);

  const printStyle="@media print{body{margin:0}.no-print{display:none!important}}";

  if(prev){
    // Per-carrier data
    const byCarr={};
    sl.forEach(l=>{
      const c=l.carrier||"Unknown";
      if(!byCarr[c]){byCarr[c]={loads:[],tot:0};}
      byCarr[c].loads.push(l);byCarr[c].tot+=(l.amount||0);
    });
    const carrKeys=Object.keys(byCarr);
    const totalPages=carrKeys.length+(carrKeys.length>1?1:0);
    const invoiceCarrier=selCarriers.length>1?selCarriers.map(c=>c.split(" ")[0]).join(" & "):selCarriers[0]||"";
    // Date range from selected loads
    const loadDates=sl.map(l=>l.pu||l.dlv||"").filter(Boolean).sort();
    const sep=" \u2013 ";
    const dateRangeStr=loadDates.length?loadDates[0].slice(5).replace("-","/")+sep+loadDates[loadDates.length-1].slice(5).replace("-","/"):"";
    const cols=["DATE","LOAD #","ROUTE",...(showDriver?["DRIVER"]:[]),...(showMiles?["MILES"]:[]),"LOAD AMT","DISPATCH FEE"];
    const TH=({h})=><th style={{padding:"8px 12px",textAlign:"left",color:"#fff",fontSize:11,fontWeight:700}}>{h}</th>;
    const Footer=()=><div style={{borderTop:"2px solid #1a2f5e",padding:"10px 32px",display:"flex",justifyContent:"center",gap:16,fontSize:10,color:"#888",marginTop:8}}><span>vesselsolutions.io</span><span>•</span><span>Professional Logistics Solutions</span><span>•</span><span>Thank you for your business!</span></div>;
    return(
      <div>
        <style>{printStyle}</style>
        <div className="no-print" style={{padding:"12px 20px",display:"flex",gap:10,background:"var(--bg)",borderBottom:"1px solid var(--b)"}}>
          <button className="btn btn-s" onClick={()=>sp(false)}>← Back</button>
          <button className="btn btn-p" onClick={()=>{
            const el=document.getElementById("invoice-wrap");
            if(!el){alert("No invoice found");return;}
            if(!window.html2pdf){alert("PDF library loading, try again");return;}
            window.html2pdf().set({margin:.4,filename:"Vessel_Invoice_"+invNum+".pdf",image:{type:"jpeg",quality:.98},html2canvas:{scale:2,useCORS:true,backgroundColor:"#fff"},jsPDF:{unit:"in",format:"letter",orientation:"portrait"}}).from(el).save();
          }}>⬇️ Download PDF</button>
          <button className="btn btn-g" onClick={gen}>✓ Save & Submit →</button>
        </div>
        <div id="invoice-wrap">
          {carrKeys.map((carr,ci)=>{
            const cdata=byCarr[carr];
            const carrFee=+(cdata.tot*(pct/100)).toFixed(2);
            const isSingle=carrKeys.length===1;
            return(
              <div key={carr} style={{background:"#fff",color:"#111",fontFamily:"Arial,sans-serif",maxWidth:860,margin:"0 auto",fontSize:13,pageBreakAfter:"always"}}>
                {/* Page header */}
                <div style={{background:"#1a2f5e",padding:"20px 32px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <div style={{background:"#fff",borderRadius:5,padding:"4px 9px",fontWeight:900,fontSize:17,color:"#1a2f5e"}}>VS</div>
                    <div style={{color:"#fff",fontWeight:700,fontSize:15}}>Vessel Solutions</div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{color:"#fff",fontSize:26,fontWeight:900,letterSpacing:"2px"}}>INVOICE</div>
                    <div style={{color:"rgba(255,255,255,.7)",fontSize:11,marginTop:2}}>Page {ci+1} of {totalPages} • {carr.split(" ").slice(0,2).join(" ")}</div>
                    <div style={{color:"rgba(255,255,255,.7)",fontSize:11}}>info@vesselsolutions.io • +1 (484) 568-3212</div>
                  </div>
                </div>
                {/* Meta bar — first page only */}
                {ci===0&&<div style={{background:"#f8f9fc",borderBottom:"1px solid #e0e4ef",padding:"13px 32px",display:"flex",gap:22,flexWrap:"wrap"}}>
                  {[["INVOICE DATE",todayStr],["DUE DATE",todayStr],["GRAND LOAD","$"+tot.toLocaleString()],...carrKeys.map(c=>[c.split(" ")[0].toUpperCase()+" DISPATCH","$"+(+(byCarr[c].tot*(pct/100)).toFixed(2)).toLocaleString()]),["GRAND DISPATCH","$"+fee.toFixed(2)]].map(([l,v])=>(
                    <div key={l}><div style={{fontSize:9,color:"#888",fontWeight:700,textTransform:"uppercase",letterSpacing:".5px",marginBottom:2}}>{l}</div><div style={{fontWeight:700,fontSize:13}}>{v}</div></div>
                  ))}
                </div>}
                {/* Client header */}
                <div style={{background:"#1a2f5e",color:"#fff",padding:"11px 32px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div style={{fontWeight:700,fontSize:14,letterSpacing:".5px"}}>CLIENT:  {carr.toUpperCase()}</div>
                  <div style={{fontSize:12,color:"rgba(255,255,255,.9)"}}>{dateRangeStr&&<span style={{marginRight:14,opacity:.85}}>{dateRangeStr}</span>}Total Dispatch Fee: <strong style={{fontSize:14}}>${carrFee.toLocaleString()}</strong></div>
                </div>
                {/* Flat load table — sorted by driver */}
                <div style={{padding:"0 32px",marginTop:16}}>
                  <table style={{width:"100%",borderCollapse:"collapse",border:"1px solid #e0e4ef"}}>
                    <thead><tr style={{background:"#1a2f5e"}}>{cols.map(h=><TH key={h} h={h}/>)}</tr></thead>
                    <tbody>{[...cdata.loads].sort((a,b)=>(a.driver||"").localeCompare(b.driver||"")).map((l,i)=>(
