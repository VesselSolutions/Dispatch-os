              <div style={{fontSize:11,color:"var(--mu)",marginTop:2}}>
                {[l.contact,l.phone,l.email].filter(Boolean).join(" · ")||"No contact yet"}
                {l.trucks?" · "+l.trucks+" truck"+(l.trucks>1?"s":""):""}{l.equipment?" · "+l.equipment:""}
              </div>
            </div>
            <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
              {(isAdmin||!own)&&l.owner_name&&<span className="bdg bp">by {l.owner_name}</span>}
              <span className={"bdg "+st.c}>{st.l}</span>
            </div>
          </div>
          {(l.closer_name||l.followup)&&<div style={{fontSize:11,marginTop:6,display:"flex",gap:12,flexWrap:"wrap"}}>
            {l.closer_name&&<span style={{color:"var(--amb)"}}>Closer: <b>{l.closer_name}</b></span>}
            {l.followup&&open&&<span style={{color:late?"var(--red)":"var(--mu)"}}>{late?"⚠️ Follow-up overdue: ":"Next follow-up: "}{d10(l.followup+"T12:00")}</span>}
            {l.stage==="closed"&&l.closed_at&&<span style={{color:"var(--green)"}}>Closed {d10(l.closed_at)}</span>}
          </div>}
          {l.notes&&<div style={{fontSize:12,marginTop:8,whiteSpace:"pre-wrap",background:"var(--sf)",borderRadius:6,padding:"6px 10px"}}>{l.notes}</div>}
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:10,alignItems:"center"}}>
            {open&&(own||isAdmin)&&l.stage==="new"&&<button className="btn btn-s btn-sm" disabled={busy} onClick={()=>save({stage:"interested"},l.id)}>→ Interested</button>}
            {open&&isAdmin&&["new","interested"].includes(l.stage)&&xfer!==l.id&&<button className="btn btn-p btn-sm" disabled={busy} onClick={()=>{setXfer(l.id);setXferTo(closers[0]?.email||"");}}>→ Transfer to Closer</button>}
            {xfer===l.id&&<>
              <select value={xferTo} onChange={e=>setXferTo(e.target.value)}>{closers.map(c=><option key={c.email} value={c.email}>{c.name}{c.role==="dispatcher"?" (dispatcher)":""}</option>)}</select>
              <button className="btn btn-p btn-sm" disabled={busy||!xferTo} onClick={async()=>{if(await save({stage:"transferred",closer_email:xferTo},l.id))setXfer(null);}}>Transfer</button>
              <button className="btn btn-s btn-sm" onClick={()=>setXfer(null)}>Cancel</button>
            </>}
            {(isAdmin||(l.stage==="transferred"&&l.closer_email===myEmail))&&open&&<><button className="btn btn-sm" style={{background:"var(--green)",color:"#fff"}} disabled={busy} onClick={()=>close(l)}>✓ Closed</button><button className="btn btn-d btn-sm" disabled={busy} onClick={()=>lose(l)}>✕ Lost</button></>}
            {isAdmin&&!open&&<button className="btn btn-s btn-sm" disabled={busy} onClick={()=>save({stage:"transferred"},l.id)}>↺ Reopen</button>}
            {((own&&open)||isAdmin||(open&&l.closer_email===myEmail))&&<button className="btn btn-s btn-sm" onClick={()=>setEdit(l)}>Edit</button>}
            <span style={{marginLeft:"auto",fontSize:10,color:"var(--mu)"}}>Added {d10(l.created_at)}</span>
          </div>
        </div>);})}
    </div>
    {edit&&<LeadModal lead={edit} busy={busy} closers={closers} isAdmin={isAdmin} myEmail={myEmail} onClose={()=>setEdit(null)} onSave={async f=>{if(await save(f,edit.id))setEdit(null);}}/>}
    {imp&&<LeadImport onClose={()=>setImp(false)} onDone={(n,t)=>{setImp(false);setStage("open");load();alert(n+" leads imported."+(t?"\n"+t+" skipped — already claimed by a rep.":""));}}/>}
  </>);
}

// CSV import for leads. Workflow: reps cold-call in Google Sheets, then upload the carriers that are
// interested. Columns are matched automatically; a Status column sets the stage:
//   interested / hot / warm / needs closing / transfer / closed  -> Interested (closing happens in the app)
//   not interested / lost / dead / no / DNC                      -> row skipped
//   anything else or no Status column                            -> New
// MC #s already claimed by ANY rep are skipped (first to claim owns the carrier).
const LEAD_FIELDS=[
  {k:"company",l:"Company *",re:/company|carrier|business|legal|dba|^name$/i},
  {k:"mc",l:"MC #",re:/\bmc\b|mc ?#|mc ?num|docket/i},
  {k:"contact",l:"Contact",re:/contact|owner|person|first ?name|full ?name/i},
  {k:"phone",l:"Phone",re:/phone|mobile|cell|tel/i},
  {k:"email",l:"Email",re:/e-?mail/i},
  {k:"trucks",l:"# Trucks",re:/truck|power ?units|units|fleet/i},
  {k:"equipment",l:"Equipment",re:/equip|trailer|type/i},
  {k:"followup",l:"Follow-up date",re:/follow|next ?(call|date)/i},
  {k:"status",l:"Status",re:/status|stage|result|outcome|disposition/i},
  {k:"notes",l:"Notes",re:/note|comment|remark/i},
];
const mcNorm=s=>((s||"")+"").replace(/\D/g,"");
const statusToStage=s=>{
  s=(s||"").toLowerCase().trim();
  if(!s)return"new";
  if(/not ?interest|lost|dead|\bno\b|dnc|do not call|wrong|bad/.test(s))return null;// skip
  if(/interest|hot|warm|clos|transfer|yes|call ?back/.test(s))return"interested";
  return"new";
};
function parseCSV(text){
  text=text.replace(/^﻿/,"");
  const first=text.split(/\r?\n/)[0]||"";
  const cnt=ch=>first.split(ch).length;
  const d=[",",";","\t"].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===d){row.push(f);f="";}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f="";}
    else f+=c;
  }
  if(f!==""||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(x=>(x||"").trim()!==""));
}
function LeadImport({onClose,onDone}){
  const[rows,setRows]=useState(null);// [header, ...data]
  const[map,setMap]=useState({});// field -> column index ("" = none)
  const[claimed,setClaimed]=useState(null);// Set of MC #s already owned by someone
  const[busy,setBusy]=useState(false);const[msg,setMsg]=useState("");
  const template="Company,MC,Contact,Phone,Email,Trucks,Equipment,Status,Follow-up,Notes\nExample Trucking LLC,1234567,John Smith,555-123-4567,john@example.com,3,Dry Van,Interested,2026-10-05,Wants Midwest lanes at 5%\n";
  // Safari-safe download: data: link attached to the page (blob links are often blocked when the app is opened from a file)
  const dlTemplate=()=>{const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(template);a.download="leads-template.csv";a.style.display="none";document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),1000);};
  const load=text=>{
    const r=parseCSV(text);if(r.length<2){setMsg("No data rows found. The first row must be the column names.");return;}
    const hdr=r[0].map(h=>(h||"").trim());const used=new Set();const m={};
    // match specific fields first so "Contact Name" goes to Contact, not Company
    ["email","phone","mc","trucks","equipment","followup","status","notes","contact","company"].forEach(k=>{
      const fd=LEAD_FIELDS.find(x=>x.k===k);const i=hdr.findIndex((h,ix)=>!used.has(ix)&&fd.re.test(h));
      if(i>=0){m[k]=i;used.add(i);}else m[k]="";
    });
    if(m.company===""){const i=hdr.findIndex((h,ix)=>!used.has(ix));if(i>=0)m.company=i;}
    setRows(r);setMap(m);setMsg("");setClaimed(null);
  };
  const onFile=e=>{const file=e.target.files[0];if(!file)return;const rd=new FileReader();rd.onload=ev=>load(ev.target.result);rd.readAsText(file);};
  const cell=(r,k)=>map[k]===""||map[k]===undefined?"":((r[map[k]]||"")+"").trim();
  const toDate=s=>{if(!s)return null;if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const d=new Date(s);if(isNaN(d))return null;return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};// local date, no time-zone shift
  const data=rows?rows.slice(1).map(r=>({
    company:cell(r,"company"),mc:cell(r,"mc"),contact:cell(r,"contact"),phone:cell(r,"phone"),email:cell(r,"email"),
    trucks:parseInt(cell(r,"trucks"))||null,equipment:cell(r,"equipment")||null,followup:toDate(cell(r,"followup")),notes:cell(r,"notes"),
    stage:statusToStage(cell(r,"status")),
  })):[];
  // Ask the database which MC #s are already claimed by anyone (re-checked whenever the MC column changes)
  const mcCol=map.mc;
  React.useEffect(()=>{
    if(!rows)return;
    const mcs=[...new Set(data.map(d=>mcNorm(d.mc)).filter(Boolean))];
    if(!mcs.length){setClaimed(new Set());return;}
    setClaimed(null);
    sbApi("rpc/claimed_mcs",{method:"POST",body:{p_mcs:mcs}}).then(d=>setClaimed(new Set((d||[]).map(x=>typeof x==="string"?x:Object.values(x)[0])))).catch(e=>{setMsg("Could not check claimed MC #s: "+e.message);setClaimed(new Set());});
  },[rows,mcCol]);
  const noCompany=data.filter(d=>!d.company).length;
  const notInterested=data.filter(d=>d.company&&d.stage===null).length;
  const seen=new Set();let taken=0,dupInFile=0;
  const toAdd=data.filter(d=>{
    if(!d.company||d.stage===null)return false;
    const mc=mcNorm(d.mc);
    if(mc&&claimed&&claimed.has(mc)){taken++;return false;}
    if(mc&&seen.has(mc)){dupInFile++;return false;}
    if(mc)seen.add(mc);return true;
  });
  const nInt=toAdd.filter(d=>d.stage==="interested").length;
  const go=async()=>{
    setBusy(true);setMsg("");
    let added=0,lateTaken=0;
    try{
      for(let i=0;i<toAdd.length;i+=200){
        const batch=toAdd.slice(i,i+200);
        try{await sbApi("leads",{method:"POST",body:batch,prefer:"return=minimal"});added+=batch.length;}
        catch(e){
          if(!/leads_mc_claim|duplicate key/i.test(e.message))throw e;
          // someone claimed one of these a moment ago — add the rest one by one
          for(const d of batch){try{await sbApi("leads",{method:"POST",body:d,prefer:"return=minimal"});added++;}catch(e2){if(/leads_mc_claim|duplicate key/i.test(e2.message))lateTaken++;else throw e2;}}
        }
      }
      onDone(added,taken+lateTaken);
    }catch(e){setMsg("Import stopped after "+added+" leads: "+e.message);}
    setBusy(false);
  };
  return(
    <div className="modal-bg" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" style={{maxWidth:760}}>
        <div className="mh"><div style={{fontWeight:700,fontSize:13}}>Import Leads from CSV</div><button className="xbtn" onClick={onClose}>✕</button></div>
        <div className="mb">
          {!rows&&<>
            <div className="al ali" style={{marginBottom:12,fontSize:12,lineHeight:1.6}}>
              Upload the carriers that are <b>interested</b> from your calling sheet.<br/>
              Google Sheets: <b>File → Download → CSV</b>. Excel: <b>File → Save As → CSV</b>.<br/>
              A <b>Status</b> column is used automatically: <i>Interested / Hot / Needs closing</i> → Interested · <i>Not interested / Lost / DNC</i> → skipped · anything else → New.<br/>
              Carriers whose MC # is already claimed by another rep are skipped — first to claim owns the carrier.
            </div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
              <label className="btn btn-p" style={{cursor:"pointer"}}>📂 Choose CSV file<input type="file" accept=".csv,text/csv,.txt" onChange={onFile} style={{display:"none"}}/></label>
              <button className="btn btn-s" onClick={dlTemplate}>⬇ Download template</button>
            </div>
          </>}
          {rows&&<>
            <div style={{fontSize:10,fontWeight:700,color:"var(--mu)",textTransform:"uppercase",letterSpacing:".5px",marginBottom:8}}>Match your columns</div>
            <div className="fg" style={{marginBottom:12}}>
              {LEAD_FIELDS.map(fd=><div key={fd.k} className="fl"><label>{fd.l}</label>
                <select value={map[fd.k]} onChange={e=>setMap(m=>({...m,[fd.k]:e.target.value===""?"":parseInt(e.target.value)}))}>
                  <option value="">— skip —</option>{rows[0].map((h,i)=><option key={i} value={i}>{h||"Column "+(i+1)}</option>)}
                </select></div>)}
            </div>
            <div style={{fontSize:10,fontWeight:700,color:"var(--mu)",textTransform:"uppercase",letterSpacing:".5px",marginBottom:6}}>Preview (first 5)</div>
            <div className="tw" style={{marginBottom:10}}><table><thead><tr><th>Company</th><th>MC</th><th>Contact</th><th>Phone</th><th>Trucks</th><th>Will be</th></tr></thead>
              <tbody>{data.slice(0,5).map((d,i)=>{const mc=mcNorm(d.mc);const tk=mc&&claimed&&claimed.has(mc);const skip=!d.company||d.stage===null||tk;return<tr key={i} style={skip?{opacity:.45}:null}>
                <td style={{fontWeight:700}}>{d.company||"(no company)"}</td><td>{d.mc}</td><td>{d.contact}</td><td>{d.phone}</td><td>{d.trucks||""}</td>
                <td>{!d.company?"skipped — no company":d.stage===null?"skipped — not interested":tk?"skipped — already claimed":<span className={"bdg "+stageOf(d.stage).c}>{stageOf(d.stage).l}</span>}</td></tr>;})}</tbody></table></div>
            {!claimed?<div style={{fontSize:12,color:"var(--mu)"}}>Checking which carriers are already claimed…</div>:
            <div style={{fontSize:12,lineHeight:1.7}}>
              <b style={{color:"var(--green)"}}>{toAdd.length}</b> leads will be added ({nInt} Interested, {toAdd.length-nInt} New)
              {taken>0&&<div style={{color:"var(--amb)"}}>⚠️ {taken} skipped — MC # already claimed by a rep</div>}
              {notInterested>0&&<div style={{color:"var(--mu)"}}>{notInterested} skipped — status "not interested"</div>}
              {dupInFile>0&&<div style={{color:"var(--mu)"}}>{dupInFile} skipped — same MC # twice in the file</div>}
              {noCompany>0&&<div style={{color:"var(--mu)"}}>{noCompany} skipped — no company name</div>}
            </div>}
          </>}
          {msg&&<div className="al ald" style={{marginTop:10}}>{msg}</div>}
        </div>
        <div className="mf">
          {rows&&<button className="btn btn-s" onClick={()=>{setRows(null);setMsg("");}}>← Other file</button>}
          <button className="btn btn-s" onClick={onClose}>Cancel</button>
          {rows&&<button className="btn btn-p" disabled={busy||!claimed||!toAdd.length} onClick={go}>{busy?"Importing…":"Import "+toAdd.length+" leads"}</button>}
        </div>
      </div>
    </div>
  );
}

function LeadModal({lead,busy,onClose,onSave,closers,isAdmin,myEmail}){
  const[f,sf]=useState({company:lead.company||"",mc:lead.mc||"",contact:lead.contact||"",phone:lead.phone||"",email:lead.email||"",trucks:lead.trucks||"",equipment:lead.equipment||"Dry Van",followup:lead.followup||"",notes:lead.notes||"",
    stage:lead.stage||"new",closer_email:lead.closer_email||""});
  const inp=k=>({value:f[k],onChange:e=>sf(x=>({...x,[k]:e.target.value}))});
  // Status choices: reps can go up to "Transferred to Closer"; only admins (closers) can set Closed / Lost
  const canClose=isAdmin||(lead.stage==="transferred"&&lead.closer_email===myEmail);
  const stages=LEAD_STAGES.filter(s=>isAdmin||s.id===lead.stage||(canClose&&["closed","lost"].includes(s.id))||!["transferred","closed","lost"].includes(s.id));// only admins transfer/close
  const needsCloser=f.stage==="transferred";
  const go=()=>{
    if(!f.company.trim()){alert("Company name is required.");return;}
    const closer=f.closer_email||(needsCloser?(closers[0]?.email||""):"");
    if(needsCloser&&!closer){alert("Pick a closer to transfer this lead to.");return;}
    const out={...f,company:f.company.trim(),trucks:f.trucks===""?null:parseInt(f.trucks)||0,followup:f.followup||null,closer_email:closer||null};
    if(!needsCloser&&!lead.closer_email)delete out.closer_email;
    onSave(out);
  };
  return(
    <div className="modal-bg" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" style={{maxWidth:560}}>

function Leaderboard({myName}){
  const n0=new Date();

  const[period,setPeriod]=useState("month");// month | year | all — same idea as the dispatcher dashboard
  const[month,setMonth]=useState(ym(n0));
  const[year,setYear]=useState(String(n0.getFullYear()));
  const[who,setWho]=useState("all");// all | sdr | dispatcher
  const[rows,setRows]=useState(null);const[err,setErr]=useState("");
  const months=[...Array(12)].map((_,i)=>ym(new Date(n0.getFullYear(),n0.getMonth()-i,1)));
  const years=[0,1,2].map(i=>String(n0.getFullYear()-i));
  const mLabel=k=>{const[y,m]=k.split("-");return new Date(y,m-1,1).toLocaleString("en-US",{month:"long",year:"numeric"});};
  React.useEffect(()=>{
    let on=true;let from=null,to=null;

    setRows(null);

    go();const iv=setInterval(go,60000);return()=>{on=false;clearInterval(iv);};

  const score=r=>r.closed*1000+r.transferred*100+r.interested*10+r.leads;
  const list=(rows||[]).filter(r=>who==="all"||r.role===who).sort((a,b)=>score(b)-score(a)||(a.name||"").localeCompare(b.name||""));

  const medal=i=>["🥇","🥈","🥉"][i]||"#"+(i+1);
  const label=period==="month"?mLabel(month):period==="year"?year:"All Time";

    {opts.map(([v,l])=><button key={v} onClick={()=>set(v)} style={{padding:"5px 12px",borderRadius:6,border:"none",fontSize:12,fontWeight:600,cursor:"pointer",background:val===v?"var(--card)":"transparent",color:val===v?"var(--tx)":"var(--mu)",fontFamily:"inherit"}}>{l}</button>)}
  </div>;
  return(<>
    <div className="tb">

        {period==="month"&&<select value={month} onChange={e=>setMonth(e.target.value)}>{months.map(k=><option key={k} value={k}>{mLabel(k)}</option>)}</select>}
        {period==="year"&&<select value={year} onChange={e=>setYear(e.target.value)}>{years.map(y=><option key={y}>{y}</option>)}</select>}
        {seg(who,setWho,[["all","Everyone"],["sdr","SDRs"],["dispatcher","Dispatchers"]])}

    </div>
    <div className="con">
      {err&&<div className="al ald" style={{marginBottom:12}}>{err}</div>}
      {!rows&&!err&&<div style={{padding:30,textAlign:"center",color:"var(--mu)"}}>Loading…</div>}
      {rows&&<>
        <div style={{fontSize:11,color:"var(--mu)",fontWeight:600,textTransform:"uppercase",letterSpacing:".5px",marginBottom:12}}>{label}{who!=="all"?" · "+(who==="sdr"?"SDRs":"Dispatchers"):""}</div>
        <div className="mg">
          <div className="mc"><div className="ml">Qualified Leads</div><div className="mv cb">{tot("leads")}</div></div>
          <div className="mc"><div className="ml">Interested</div><div className="mv cacc">{tot("interested")}</div></div>
          <div className="mc"><div className="ml">Transferred</div><div className="mv ca">{tot("transferred")}</div></div>
          <div className="mc"><div className="ml">Closed</div><div className="mv cg">{tot("closed")}</div></div>
        </div>
        {list.filter(r=>score(r)>0).length>0&&<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:12,marginBottom:16}}>
          {list.slice(0,3).filter(r=>score(r)>0).map((r,i)=><div key={r.name} className="card" style={{padding:14,marginBottom:0,textAlign:"center",border:r.name===myName?"1px solid var(--acc)":undefined}}>
            <div style={{fontSize:30}}>{medal(i)}</div>
            <div style={{fontWeight:800,fontSize:14,marginTop:4}}>{r.name}{r.name===myName?" (you)":""}</div>
            <div style={{fontSize:11,color:"var(--mu)",marginTop:4}}><b style={{color:"var(--green)",fontSize:16}}>{r.closed}</b> closed · {r.transferred} transferred · {r.leads} qualified</div>
          </div>)}
        </div>}
        {list.length===0?<div style={{padding:30,textAlign:"center",color:"var(--mu)"}}>Nobody here yet.</div>:
        <div className="tw"><table><thead><tr><th>Rank</th><th>Name</th><th>Qualified</th><th>Interested</th><th>Transferred</th><th>Closed</th><th>Active Trucks</th></tr></thead>
          <tbody>{list.map((r,i)=><tr key={r.name+i} style={r.name===myName?{background:"rgba(245,158,11,.08)"}:null}>
            <td style={{fontWeight:800}}>{score(r)>0?medal(i):"—"}</td>
            <td style={{fontWeight:700}}>{r.name}{r.name===myName?" (you)":""} <span className={"bdg "+(r.role==="sdr"?"ba":"bb")} style={{marginLeft:4}}>{r.role}</span></td>
            <td>{r.leads}</td><td>{r.interested}</td><td>{r.transferred}</td>

          </tr>)}</tbody></table></div>}
        <div style={{fontSize:12,color:"var(--mu)",marginTop:14,textAlign:"center"}}>Every closed carrier = a monthly commission for 12 months per truck. Who's next? 🚛</div>
      </>}
    </div>
  </>);
}

// ADMIN: SDR Performance — every SDR's referred trucks, revenue, commission and lead activity.
// "Open" shows exactly what that SDR sees in their own portal.
function SDRPerformance({users,loads,drivers}){
  const[sel,setSel]=useState(null);// SDR user opened in detail
  const[leadStats,setLeadStats]=useState({});// name -> leaderboard row (all time)
  React.useEffect(()=>{sbApi("rpc/sdr_leaderboard",{method:"POST",body:{p_from:null,p_to:null}}).then(d=>setLeadStats(Object.fromEntries((d||[]).map(r=>[r.name,r])))).catch(()=>{});},[]);
  const nl=React.useMemo(()=>loads.map(l=>({...l,amount:Number(l.amount)||0})),[loads]);
  if(sel)return<SDRView me={{name:sel.name,sdrTrucks:sel.sdrTrucks||[]}} loads={nl} drivers={drivers} onLogout={()=>setSel(null)} exitLabel="← All SDRs"/>;
  const now=new Date();
  const ymNow=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
  const loadDt=l=>{const d=new Date((l.dlv||l.date||l.pu||l.ts||"").slice(0,10)+"T12:00");return isNaN(d)?null:d;};
  const ym=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
  const fmt=n=>"$"+(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  // Same rules as the SDR portal: eligible = completed & not cancelled, inside each truck's 12-month window
  const stats=u=>{
    let active=0,mRev=0,mCom=0,mLoads=0,tCom=0;
    (u.sdrTrucks||[]).forEach(t=>{
      const nm=(t.driver||"").toUpperCase();const rate=SDR_TIERS[t.fee]||0;
      const elig=nl.filter(l=>(l.driver||"").toUpperCase()===nm&&sdrEligible(l)&&loadDt(l)).sort((a,b)=>loadDt(a)-loadDt(b));
      const start=t.start?new Date(t.start+"T00:00"):(elig[0]?loadDt(elig[0]):null);if(!start)return;
      const end=new Date(start.getFullYear(),start.getMonth()+SDR_MONTHS,start.getDate());
      if(now<end)active++;
      elig.filter(l=>{const d=loadDt(l);return d>=start&&d<end;}).forEach(l=>{
        tCom+=l.amount*rate/100;
        if(ym(loadDt(l))===ymNow){mRev+=l.amount;mCom+=l.amount*rate/100;mLoads++;}
      });
    });
    return{trucks:(u.sdrTrucks||[]).length,active,mRev,mCom,mLoads,tCom};
  };
  const sdrs=users.filter(u=>u.role==="sdr").map(u=>({u,s:stats(u),ls:leadStats[u.name]||{}}));
  const tot=k=>sdrs.reduce((a,x)=>a+(x.s[k]||0),0);
  const monthName=now.toLocaleString("en-US",{month:"long"});
  return(<>
    <div className="tb"><div><div className="pt">📈 SDR Performance</div><div className="ps">Referred trucks, commission and lead activity per SDR · click an SDR to see their portal</div></div></div>
    <div className="con">
      <div className="mg">
        <div className="mc"><div className="ml">SDRs</div><div className="mv cb">{sdrs.length}</div></div>
        <div className="mc"><div className="ml">Active Trucks</div><div className="mv cacc">{tot("active")}</div></div>
        <div className="mc"><div className="ml">{monthName} Truck Revenue</div><div className="mv">{fmt(tot("mRev"))}</div></div>
        <div className="mc"><div className="ml">{monthName} SDR Commission</div><div className="mv cg">{fmt(tot("mCom"))}</div></div>
      </div>
      {sdrs.length===0?<div style={{padding:30,textAlign:"center",color:"var(--mu)"}}>No SDRs yet. Add one in Users with role “SDR (external)”.</div>:
      <div className="tw"><table><thead><tr><th>SDR</th><th>Trucks (active)</th><th>{monthName} Loads</th><th>{monthName} Revenue</th><th>{monthName} Commission</th><th>Commission to Date</th><th>Leads (qualified / transferred / closed)</th><th></th></tr></thead>
        <tbody>{sdrs.map(({u,s,ls})=><tr key={u.id} style={{cursor:"pointer"}} onClick={()=>setSel(u)}>
          <td style={{fontWeight:700}}>{u.name}<div style={{fontSize:10,color:"var(--mu)"}}>{(u.sdrTrucks||[]).map(t=>t.driver+" ("+t.fee+"%)").join(", ")||"no trucks yet"}</div></td>
          <td>{s.trucks} <span style={{color:"var(--green)"}}>({s.active} active)</span></td>
          <td><span className="bdg bx">{s.mLoads}</span></td>
          <td style={{color:"var(--acc)"}}>{fmt(s.mRev)}</td>
          <td style={{fontWeight:700,color:"var(--green)"}}>{fmt(s.mCom)}</td>
          <td style={{fontWeight:700,color:"var(--green)"}}>{fmt(s.tCom)}</td>
          <td>{ls.leads??0} / {ls.transferred??0} / <b style={{color:"var(--green)"}}>{ls.closed??0}</b></td>
          <td><button className="btn btn-s btn-sm">Open →</button></td>
        </tr>)}</tbody></table></div>}
    </div>
  </>);
}

// SDR PORTAL — external sales rep. Data comes from the sdr_portal() database function,
// which returns ONLY this SDR's trucks and a limited set of load fields.
function SDRPortal({onLogout}){
  const[tab,setTab]=useState("trucks");// trucks | leads | board
  const[data,setData]=useState(null);const[err,setErr]=useState("");
  React.useEffect(()=>{
    let on=true;
    const go=()=>fetch(SB+"/rest/v1/rpc/sdr_portal",{method:"POST",headers:SBH,body:"{}"})
      .then(async r=>{const d=await r.json().catch(()=>({}));if(!on)return;if(r.ok){setData(d);setErr("");}else setErr(d.message||"Could not load your data");})
      .catch(()=>on&&setErr("Offline — retrying…"));
    go();const iv=setInterval(go,60000);
    return()=>{on=false;clearInterval(iv);};
  },[]);
  const tabs=<div style={{display:"flex",gap:6,padding:"10px 16px",background:"var(--sf)",borderBottom:"1px solid var(--b)",flexWrap:"wrap",alignItems:"center"}}>
    {[["trucks","🚛 My Trucks"],["leads","🎯 My Leads"],["board","🏆 Leaderboard"]].map(([id,l])=><button key={id} className={"btn btn-sm "+(tab===id?"btn-p":"btn-s")} onClick={()=>setTab(id)}>{l}</button>)}
    <button className="btn btn-s btn-sm" style={{marginLeft:"auto"}} onClick={onLogout}>Sign Out</button>
  </div>;
  const page=c=><div style={{minHeight:"100vh",background:"var(--bg)"}}>{tabs}{c}</div>;
  if(tab==="leads")return page(<Leads isAdmin={false} myEmail={_auth?.email}/>);
  if(tab==="board")return page(<Leaderboard myName={data?.name}/>);
  if(!data)return page(<div style={{padding:40,textAlign:"center",color:"var(--mu)"}}>{err||"Loading…"}</div>);
  const loads=(data.loads||[]).map(l=>({...l,amount:Number(l.amount)||0}));
  return page(<SDRView me={{name:data.name,sdrTrucks:data.trucks||[]}} loads={loads} drivers={data.drivers||[]} onLogout={onLogout}/>);
}
function SDRView({me,loads,drivers,onLogout,exitLabel}){
  const ym=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
  const now=new Date();
  const[period,setPeriod]=useState("month");// month|year|all — same toggle as the dispatcher dashboard
  const[month,setMonth]=useState(ym(now));
  const[year,setYear]=useState(String(now.getFullYear()));
  const[sel,setSel]=useState(null);// driver name of the truck opened in detail
  const loadDt=l=>{const d=new Date((l.dlv||l.date||l.pu||l.ts||"").slice(0,10)+"T12:00");return isNaN(d)?null:d;};
  const fmt=n=>"$"+(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  const mLabel=k=>{const[y,m]=k.split("-");return new Date(y,m-1,1).toLocaleString("en-US",{month:"short",year:"numeric"});};
  const d10=d=>d?d.toLocaleDateString("en-US"):"—";
  const inPeriod=k=>period==="all"||(period==="year"?k.startsWith(year+"-"):k===month);
  const periodLabel=period==="all"?"All Time":period==="year"?year:mLabel(month);
  const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);

  const trucks=(me.sdrTrucks||[]).map(t=>{
    const nm=(t.driver||"").toUpperCase();
    const drv=drivers.find(d=>(d.name||"").toUpperCase()===nm)||{};
    const rate=SDR_TIERS[t.fee]||0;
    const elig=loads.filter(l=>(l.driver||"").toUpperCase()===nm&&sdrEligible(l)&&loadDt(l)).sort((a,b)=>loadDt(a)-loadDt(b));
    const start=t.start?new Date(t.start+"T00:00"):(elig[0]?loadDt(elig[0]):null);
    const end=start?new Date(start.getFullYear(),start.getMonth()+SDR_MONTHS,start.getDate()):null;
    const inWin=start?elig.filter(l=>{const d=loadDt(l);return d>=start&&d<end;}):[];
    const byMonth={};
    inWin.forEach(l=>{const k=ym(loadDt(l));if(!byMonth[k])byMonth[k]={rev:0,n:0,miles:0};byMonth[k].rev+=l.amount||0;byMonth[k].n++;byMonth[k].miles+=Number(l.miles)||0;});
    const pLoads=inWin.filter(l=>inPeriod(ym(loadDt(l)))).sort((a,b)=>loadDt(b)-loadDt(a));
    const pRev=sum(pLoads,l=>l.amount||0),pMiles=sum(pLoads,l=>Number(l.miles)||0);
    const totRev=sum(inWin,l=>l.amount||0);
    const active=!!start&&now<end;
    const monthsLeft=active?Math.max(0,(end.getFullYear()-now.getFullYear())*12+end.getMonth()-now.getMonth()):0;
    return{...t,drv,rate,start,end,byMonth,pLoads,pRev,pMiles,pCom:pRev*rate/100,totRev,totCom:totRev*rate/100,active,monthsLeft};
  });
  const pRev=sum(trucks,t=>t.pRev),pCom=sum(trucks,t=>t.pCom),totCom=sum(trucks,t=>t.totCom);
  const allMonths=[...new Set([ym(now),...trucks.flatMap(t=>Object.keys(t.byMonth))])].sort().reverse();
  const allYears=[...new Set(allMonths.map(k=>k.slice(0,4)))].sort().reverse();
  const status=t=>t.active?["bg","Active · "+t.monthsLeft+" mo left"]:t.start?["br","Period ended"]:["bx","Awaiting first load"];
  const route=l=>(l.pickup||"").split(",").slice(0,2).join(",")+" → "+(l.delivery||"").split(",").slice(0,2).join(",");
  const cur=sel&&trucks.find(t=>t.driver===sel);

  const Toggle=(
    <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
      <div style={{display:"flex",gap:5,background:"var(--sf)",border:"1px solid var(--b)",borderRadius:8,padding:3}}>
        {["month","year","all"].map(p=>(
          <button key={p} onClick={()=>setPeriod(p)} style={{padding:"5px 12px",borderRadius:6,border:"none",fontSize:12,fontWeight:600,cursor:"pointer",background:period===p?"var(--card)":"transparent",color:period===p?"var(--tx)":"var(--mu)",fontFamily:"inherit"}}>
            {p==="month"?"Month":p==="year"?"Year":"All Time"}
          </button>
        ))}
      </div>
      {period==="month"&&<select value={month} onChange={e=>setMonth(e.target.value)}>{allMonths.map(k=><option key={k} value={k}>{mLabel(k)}</option>)}</select>}
      {period==="year"&&<select value={year} onChange={e=>setYear(e.target.value)}>{allYears.map(y=><option key={y} value={y}>{y}</option>)}</select>}
      <button className="btn btn-s" onClick={onLogout}>{exitLabel||"Sign Out"}</button>
    </div>
  );
  const header=(title,sub)=>(
    <div className="tb"><div><div className="pt">{title}</div><div className="ps">{sub}</div></div>{Toggle}</div>
  );
  const Info=({l,v,c})=><div className="mc" style={{padding:"10px 14px"}}><div className="ml">{l}</div><div style={{fontWeight:700,fontSize:14,color:c||"var(--tx)"}}>{v}</div></div>;

  // ── Truck detail page
  if(cur){const[sc,st]=status(cur);const months=Object.keys(cur.byMonth).filter(inPeriod).sort().reverse();return(
    <div style={{minHeight:"100vh",background:"var(--bg)"}}>
      {header("🚛 "+cur.driver+(cur.drv.truck?" · Truck "+cur.drv.truck:""),<>{me.name} · <span className="sb-role r-sdr">SDR</span></>)}
      <div className="con">
        <button className="btn btn-s btn-sm" style={{marginBottom:14}} onClick={()=>setSel(null)}>← All trucks</button>
        <div className="sh"><div className="st">Truck Info</div></div>
        <div className="mg">
          <Info l="Driver" v={cur.driver}/>
          <Info l="Truck #" v={cur.drv.truck||"—"}/>
          <Info l="Trailer" v={cur.drv.trailer||"—"}/>
          <Info l="Carrier" v={cur.drv.carrier||"—"}/>
          <Info l="Dispatch Fee" v={cur.fee+"%"}/>
          <Info l="Your Rate" v={cur.rate+"% of revenue"} c="var(--amb)"/>
          <Info l="Commission Period" v={d10(cur.start)+" → "+d10(cur.end)}/>
          <Info l="Status" v={<span className={"bdg "+sc}>{st}</span>}/>
        </div>
        <div className="sh"><div className="st">{periodLabel}</div></div>
        <div className="mg">
          <div className="mc"><div className="ml">Loads</div><div className="mv cb">{cur.pLoads.length}</div></div>
          <div className="mc"><div className="ml">Eligible Revenue</div><div className="mv cacc">{fmt(cur.pRev)}</div></div>
          <div className="mc"><div className="ml">Miles</div><div className="mv">{cur.pMiles.toLocaleString()}</div></div>
          <div className="mc"><div className="ml">Avg $/Mile</div><div className="mv">{cur.pMiles?"$"+(cur.pRev/cur.pMiles).toFixed(2):"—"}</div></div>
          <div className="mc"><div className="ml">Your Commission</div><div className="mv cg">{fmt(cur.pCom)}</div></div>
        </div>
        {months.length>0&&<>
          <div className="sh"><div className="st">By Month</div></div>
          <div className="tw" style={{marginBottom:14}}><table><thead><tr><th>Month</th><th>Loads</th><th>Miles</th><th>Eligible Revenue</th><th>Rate</th><th>Commission</th></tr></thead>
            <tbody>{months.map(k=>{const b=cur.byMonth[k];return<tr key={k}>
              <td style={{fontWeight:600}}>{mLabel(k)}</td><td><span className="bdg bx">{b.n}</span></td><td>{b.miles.toLocaleString()}</td>
              <td style={{color:"var(--green)"}}>{fmt(b.rev)}</td><td>{cur.rate}%</td>
              <td style={{fontWeight:700,color:"var(--green)"}}>{fmt(b.rev*cur.rate/100)}</td></tr>;})}
            <tr><td style={{fontWeight:800}}>Total</td><td>{cur.pLoads.length}</td><td>{cur.pMiles.toLocaleString()}</td><td style={{fontWeight:700}}>{fmt(cur.pRev)}</td><td></td><td style={{fontWeight:800,color:"var(--green)"}}>{fmt(cur.pCom)}</td></tr>
            </tbody></table></div>
        </>}
        <div className="sh"><div className="st">Loads — {periodLabel}</div></div>
        {cur.pLoads.length===0?<div style={{textAlign:"center",padding:30,color:"var(--mu)"}}>No completed loads in this period</div>:
        <div className="tw"><table><thead><tr><th>Delivered</th><th>Route</th><th>Miles</th><th>$/Mile</th><th>Revenue</th><th>Your Commission</th></tr></thead>
          <tbody>{cur.pLoads.map(l=>{const mi=Number(l.miles)||0;return<tr key={l.id}>
            <td>{d10(loadDt(l))}</td><td style={{fontSize:11}}>{route(l)}</td><td>{mi||"—"}</td>
            <td>{mi?"$"+((l.amount||0)/mi).toFixed(2):"—"}</td>
            <td style={{color:"var(--green)"}}>{fmt(l.amount)}</td>
            <td style={{fontWeight:700,color:"var(--green)"}}>{fmt((l.amount||0)*cur.rate/100)}</td></tr>;})}</tbody></table></div>}
        <div style={{fontSize:10,color:"var(--mu)",marginTop:10}}>Only completed, non-cancelled loads inside this truck's 12-month commission period are counted.</div>
      </div>
    </div>);}

  // ── Overview: all referred trucks
  return(
    <div style={{minHeight:"100vh",background:"var(--bg)"}}>
      {header("⚓ Vessel Solutions — SDR Portal",<>{me.name} · <span className="sb-role r-sdr">SDR</span></>)}
      <div className="con">
        <div style={{fontSize:11,color:"var(--mu)",fontWeight:600,textTransform:"uppercase",letterSpacing:".5px",marginBottom:12}}>{periodLabel}</div>
        <div className="mg">
          <div className="mc"><div className="ml">Referred Trucks</div><div className="mv cb">{trucks.length}</div></div>
          <div className="mc"><div className="ml">{periodLabel} Eligible Revenue</div><div className="mv cacc">{fmt(pRev)}</div></div>
          <div className="mc"><div className="ml">{periodLabel} Commission</div><div className="mv cg">{fmt(pCom)}</div></div>
          <div className="mc"><div className="ml">Total Commission to Date</div><div className="mv cg">{fmt(totCom)}</div></div>
        </div>
        {trucks.length===0&&<div style={{textAlign:"center",padding:40,color:"var(--mu)"}}>No trucks assigned yet. Contact Vessel Solutions.</div>}
        {trucks.map(t=>{const[sc,st]=status(t);return(
          <div key={t.driver} className="card" onClick={()=>setSel(t.driver)} style={{marginBottom:12,padding:16,cursor:"pointer"}}>
            <div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:8,marginBottom:10}}>
              <div>
                <div style={{fontWeight:800,fontSize:15}}>{t.driver}{t.drv.truck?<span style={{color:"var(--mu)",fontWeight:400,fontSize:12}}> · Truck {t.drv.truck}</span>:null}</div>
                <div style={{fontSize:11,color:"var(--mu)"}}>{t.drv.carrier||""}</div>
              </div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
                <span className="bdg bx">Dispatch fee {t.fee}%</span>
                <span className="bdg ba">Your rate {t.rate}%</span>
                <span className={"bdg "+sc}>{st}</span>
              </div>
            </div>
            <div style={{display:"flex",gap:18,flexWrap:"wrap",alignItems:"center",fontSize:12}}>
              <div><span style={{color:"var(--mu)"}}>Loads </span><b>{t.pLoads.length}</b></div>
              <div><span style={{color:"var(--mu)"}}>Revenue </span><b style={{color:"var(--acc)"}}>{fmt(t.pRev)}</b></div>
              <div><span style={{color:"var(--mu)"}}>Commission </span><b style={{color:"var(--green)"}}>{fmt(t.pCom)}</b></div>
              <div><span style={{color:"var(--mu)"}}>To date </span><b style={{color:"var(--green)"}}>{fmt(t.totCom)}</b></div>
              <span className="btn btn-s btn-sm" style={{marginLeft:"auto"}}>Open truck →</span>
            </div>
          </div>);})}
        <div style={{fontSize:10,color:"var(--mu)",marginTop:10}}>Eligible revenue = completed loads dispatched by Vessel Solutions for your referred trucks, excluding cancelled loads. Commission is calculated and paid at the end of each month. Figures are for tracking only and are subject to final monthly statement.</div>
      </div>
    </div>
  );
}

// CHAT
function Chat({ctx}){
  const{chats,setChats,sess,users}=ctx;
  const[msg,sm]=useState("");const[to,st]=useState("ALL");
  const ref=useRef(null);
  useEffect(()=>ref.current?.scrollIntoView({behavior:"smooth"}),[chats]);
  const send=()=>{
    if(!msg.trim())return;
    const n=new Date();const ts=String(n.getMonth()+1).padStart(2,"0")+"/"+String(n.getDate()).padStart(2,"0")+" "+String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");
    setChats(c=>[...c,{id:Date.now(),from:sess.name,to,msg:msg.trim(),time:ts}]);sm("");
  };
  const vis=chats.filter(c=>c.to==="ALL"||c.from===sess.name||c.to===sess.name);
  return(<>
    <div className="tb"><div><div className="pt">Team Chat</div><div className="ps">Internal dispatch communications</div></div></div>
    <div className="chat-wrap">
      <div className="chat-msgs">
        {vis.length===0&&<div style={{textAlign:"center",padding:28,color:"var(--mu)"}}>No messages</div>}
        {vis.map(c=><div key={c.id} style={{maxWidth:"78%",alignSelf:c.from===sess.name?"flex-end":"flex-start"}}>
          <div style={{fontSize:10,color:"var(--mu)",marginBottom:3,fontWeight:600,textAlign:c.from===sess.name?"right":"left"}}>{c.from}{c.to!=="ALL"?" → "+c.to:""}</div>
          <div className={"cmsg "+(c.from===sess.name?"mine":"theirs")}>{c.msg}<div style={{fontSize:9,color:"var(--mu)",marginTop:3}}>{c.time}</div></div>
        </div>)}
        <div ref={ref}/>
      </div>
      <div className="cin">
        <select style={{width:110,background:"var(--sf)",border:"1px solid var(--b)",color:"var(--tx)",borderRadius:6,padding:"6px 8px",fontSize:12,fontFamily:"inherit"}} value={to} onChange={e=>st(e.target.value)}><option value="ALL">→ ALL</option>{users.filter(u=>u.name!==sess.name&&u.role!=="sdr").map(u=><option key={u.id} value={u.name}>{u.name}</option>)}</select>
        <input style={{flex:1}} placeholder="Type message..." value={msg} onChange={e=>sm(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()}/>
        <button className="btn btn-p" onClick={send}>Send</button>
      </div>
    </div>
  </>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
